<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Saját kezdőképernyő</title><link rel="stylesheet" href="launcher.css"><script src="launcher-host.js"></script></head>
<body class="launcher-tv-body"><div id="launcher-boot" class="launcher-boot-cover" aria-hidden="true"><div class="launcher-boot-panel"><div class="launcher-boot-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="launcher-boot-copy"><strong>Kezdőképernyő</strong><span>Betöltés<span class="launcher-boot-dots" aria-hidden="true"></span></span></div></div></div><main id="launcher-root"></main>
<script>
(function () {
  var quick = window.__LAUNCHER_HOST__ && window.__LAUNCHER_HOST__.host === 'quick';
  var cover = document.getElementById('launcher-boot');
  document.body.style.background = quick ? 'transparent' : '#10131b';
  if (quick) { document.documentElement.className += ' launcher-overlay-launch'; cover.hidden = true; }
}());
</script>
<script src="launcher-cache.js"></script><script src="launcher-quick-core.js"></script><script src="launcher-popup-lifecycle.js"></script><script src="launcher-ui.js"></script><script src="app.js"></script></body></html>
