name: EIM input-app boot probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eim-probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Backup EIM, arm isolated probe, reboot once, measure and restore
        shell: bash
        run: |
          set -euo pipefail

          MARKER=/media/lgtv/rollback-20260925-pre-activity-manager/COMPLETE
          test -f "$MARKER"

          TV_HOST=192.168.0.240
          TV=root@"$TV_HOST"
          SOURCE_KEY=/media/lgtv/id_rsa
          APP_ID=hu.szabi.launcher.eimprobe
          VERSION=0.0.1
          HDMI_APP=com.webos.app.hdmi2

          TMP="$(mktemp -d)"
          KEY="$TMP/id_rsa"
          KNOWN="$TMP/known_hosts"
          BACKUP="/media/lgtv/eim-probe-backup-${GITHUB_SHA:0:12}"
          mkdir -p "$BACKUP"

          cp "$SOURCE_KEY" "$KEY"
          chmod 600 "$KEY"
          ssh-keyscan -T 3 "$TV_HOST" >"$KNOWN" 2>/dev/null
          test -s "$KNOWN"

          SSH=(ssh -T -i "$KEY" -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" "$TV")
          SCP=(scp -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN")

          ssh_ok() {
            "${SSH[@]}" true >/dev/null 2>&1
          }

          luna_file() {
            local label="$1"
            local uri="$2"
            local payload="$3"
            "${SSH[@]}" "luna-send -t 1 -f -w 6000 'luna://$uri' '$payload' 2>&1" >"$TMP/$label.txt" || true
          }

          extract_json() {
            python3 - "$1" <<'PY'
          import json
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          decoder = json.JSONDecoder()
          found = None
          for line in reversed(text.splitlines()):
              for index, char in enumerate(line):
                  if char != "{":
                      continue
                  try:
                      candidate, _ = decoder.raw_decode(line[index:])
                  except json.JSONDecodeError:
                      continue
                  if isinstance(candidate, dict):
                      found = candidate
                      break
              if found is not None:
                  break
          if found is None:
              raise SystemExit("no JSON response")
          print(json.dumps(found, separators=(",", ":")))
          PY
          }

          restore_needed=0
          probe_installed=0
          cleanup() {
            set +e
            if ssh_ok; then
              echo CLEANUP_TV_REACHABLE=YES

              luna_file cleanup_delete com.webos.service.eim/deleteDevice "{\"appId\":\"$APP_ID\"}"
              echo "CLEANUP_DELETE_DEVICE=$(extract_json "$TMP/cleanup_delete.txt" 2>/dev/null || true)"

              luna_file cleanup_hdmi com.webos.service.applicationmanager/launch "{\"id\":\"$HDMI_APP\",\"params\":{\"source\":\"eim-probe-cleanup\"}}"
              sleep 2

              if [ -f "$BACKUP/eim_device_db.json" ] && [ -f "$BACKUP/lastinput" ]; then
                "${SCP[@]}" "$BACKUP/eim_device_db.json" "$TV:/tmp/eim_device_db.baseline.json" >/dev/null 2>&1 || true
                "${SCP[@]}" "$BACKUP/lastinput" "$TV:/tmp/eim_lastinput.baseline" >/dev/null 2>&1 || true
                "${SSH[@]}" "cp /tmp/eim_device_db.baseline.json /var/lib/eim/eim_device_db.json; cp /tmp/eim_lastinput.baseline /var/lib/eim/lastinput; chmod 644 /var/lib/eim/eim_device_db.json /var/lib/eim/lastinput; rm -f /tmp/eim_device_db.baseline.json /tmp/eim_lastinput.baseline" >/dev/null 2>&1 || true
              fi

              if [ "$probe_installed" -eq 1 ]; then
                "${SSH[@]}" "/usr/bin/luna-send-pub -t 1 -w 30000 -f 'luna://com.webos.appInstallService/dev/remove' '{\"id\":\"$APP_ID\",\"subscribe\":true}'" >/dev/null 2>&1 || true
              fi

              luna_file cleanup_last com.webos.service.eim/getLastInput '{}'
              echo "CLEANUP_LAST_INPUT=$(extract_json "$TMP/cleanup_last.txt" 2>/dev/null || true)"
              luna_file cleanup_settings com.webos.settingsservice/getSystemSettings '{"category":"general","keys":["lastInputApp","physicalLastInputApp"],"subscribe":false}'
              echo "CLEANUP_GENERAL_SETTINGS=$(extract_json "$TMP/cleanup_settings.txt" 2>/dev/null || true)"

              echo "CLEANUP_LASTINPUT_FILE=$("${SSH[@]}" 'cat /var/lib/eim/lastinput 2>/dev/null' || true)"
              echo "CLEANUP_DB_SHA=$("${SSH[@]}" 'sha256sum /var/lib/eim/eim_device_db.json 2>/dev/null | cut -d" " -f1' || true)"
              echo "CLEANUP_LASTINPUT_SHA=$("${SSH[@]}" 'sha256sum /var/lib/eim/lastinput 2>/dev/null | cut -d" " -f1' || true)"
            else
              echo CLEANUP_TV_REACHABLE=NO
            fi
            rm -rf "$TMP"
          }
          trap cleanup EXIT

          ssh_ok
          echo TV_SSH_BEFORE=PASS
          echo ROLLBACK_BASELINE=PASS

          "${SSH[@]}" "test -f /var/lib/eim/eim_device_db.json && test -f /var/lib/eim/lastinput"
          "${SSH[@]}" "cat /var/lib/eim/eim_device_db.json" >"$BACKUP/eim_device_db.json"
          "${SSH[@]}" "cat /var/lib/eim/lastinput" >"$BACKUP/lastinput"
          "${SSH[@]}" "tar -C /var/lib -czf - eim" >"$BACKUP/eim-full.tar.gz"
          sha256sum "$BACKUP/eim_device_db.json" "$BACKUP/lastinput" "$BACKUP/eim-full.tar.gz" >"$BACKUP/SHA256SUMS"
          sha256sum -c "$BACKUP/SHA256SUMS"
          echo "BACKUP_DIR=$BACKUP"
          echo EIM_BACKUP=PASS
          echo "BASELINE_LASTINPUT=$(cat "$BACKUP/lastinput")"

          luna_file baseline_last com.webos.service.eim/getLastInput '{}'
          BASELINE_LAST="$(extract_json "$TMP/baseline_last.txt")"
          echo "BASELINE_GET_LAST_INPUT=$BASELINE_LAST"
          echo "$BASELINE_LAST" | grep -q '"lastSourceAppId":"com.webos.app.hdmi2"'

          luna_file baseline_settings com.webos.settingsservice/getSystemSettings '{"category":"general","keys":["lastInputApp","physicalLastInputApp"],"subscribe":false}'
          BASELINE_SETTINGS="$(extract_json "$TMP/baseline_settings.txt")"
          printf '%s\n' "$BASELINE_SETTINGS" >"$BACKUP/general-last-input-settings.json"
          echo "BASELINE_GENERAL_SETTINGS=$BASELINE_SETTINGS"

          python3 tools/lab/build-eim-autostart-probe.py >"$TMP/build.txt"
          IPK="$GITHUB_WORKSPACE/build/${APP_ID}_${VERSION}_all.ipk"
          test -f "$IPK"
          DIGEST="$(sha256sum "$IPK" | awk '{print $1}')"

          REMOTE="/tmp/hu.szabi.eim-probe.$$"
          "${SSH[@]}" "mkdir -p '$REMOTE'"
          "${SCP[@]}" "$IPK" "$TV:$REMOTE/probe.ipk"
          "${SCP[@]}" scripts/install-local-on-tv.sh "$TV:$REMOTE/install.sh"
          "${SSH[@]}" "chmod 700 '$REMOTE/install.sh'; sh '$REMOTE/install.sh' '$REMOTE/probe.ipk' '$DIGEST'"
          probe_installed=1
          echo PROBE_INSTALL=PASS

          luna_file add_device com.webos.service.eim/addDevice "{\"appId\":\"$APP_ID\",\"pigImage\":\"\",\"mvpdIcon\":\"\",\"showPopup\":false}"
          ADD="$(extract_json "$TMP/add_device.txt")"
          echo "ADD_DEVICE=$ADD"
          echo "$ADD" | grep -q '"returnValue":true'
          restore_needed=1
          echo EIM_ADD_DEVICE=PASS

          luna_file prelaunch com.webos.service.applicationmanager/launch "{\"id\":\"$APP_ID\",\"params\":{\"source\":\"eim-preflight\"}}"
          PRELAUNCH="$(extract_json "$TMP/prelaunch.txt")"
          echo "PREFLIGHT_LAUNCH=$PRELAUNCH"
          echo "$PRELAUNCH" | grep -q '"returnValue":true'

          READY=0
          for i in $(seq 1 20); do
            luna_file last_after com.webos.service.eim/getLastInput '{}'
            LAST_AFTER="$(extract_json "$TMP/last_after.txt" 2>/dev/null || true)"
            FILE_AFTER="$("${SSH[@]}" 'cat /var/lib/eim/lastinput 2>/dev/null' || true)"
            if echo "$LAST_AFTER" | grep -q "\"lastSourceAppId\":\"$APP_ID\"" &&
               echo "$FILE_AFTER" | grep -q "\"appId\":\"$APP_ID\""; then
              READY=1
              echo "EIM_READY_AFTER_HALFSECONDS=$i"
              break
            fi
            sleep 0.5
          done

          echo "PREFLIGHT_GET_LAST_INPUT=$LAST_AFTER"
          echo "PREFLIGHT_LASTINPUT_FILE=$FILE_AFTER"
          if [ "$READY" -ne 1 ]; then
            echo EIM_PREFLIGHT=FAILED_NO_REBOOT
            exit 10
          fi
          echo EIM_PREFLIGHT=PASS

          "${SSH[@]}" "grep -q '\"szAppId\"[[:space:]]*:[[:space:]]*\"$APP_ID\"' /var/lib/eim/eim_device_db.json"
          echo EIM_DEVICE_DB=PASS

          PRE_UPTIME="$("${SSH[@]}" "cut -d' ' -f1 /proc/uptime")"
          echo "PRE_REBOOT_UPTIME_SECONDS=$PRE_UPTIME"
          "${SSH[@]}" 'sync; reboot' >/dev/null 2>&1 || true
          echo REBOOT_COMMAND_SENT=PASS

          DROPPED=0
          for i in $(seq 1 45); do
            if ! ssh_ok; then
              DROPPED=1
              echo "SSH_DROPPED_AFTER_SECONDS=$i"
              break
            fi
            sleep 1
          done
          test "$DROPPED" -eq 1
          echo TV_SSH_DROP=PASS

          RETURNED=0
          for i in $(seq 1 180); do
            if ssh_ok; then
              RETURNED=1
              echo "SSH_RETURNED_AFTER_SECONDS=$i"
              break
            fi
            sleep 1
          done
          test "$RETURNED" -eq 1
          echo TV_SSH_AFTER=PASS

          SSH_UPTIME="$("${SSH[@]}" "cut -d' ' -f1 /proc/uptime")"
          echo "SSH_RETURN_BOOT_UPTIME_SECONDS=$SSH_UPTIME"

          "${SSH[@]}" "cat /var/log/bootd.log" >"$TMP/bootd.log"
          python3 - "$TMP/bootd.log" "$APP_ID" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          app = re.escape(sys.argv[2])
          patterns = [
              (r'DEBUG\(\s*([0-9.]+)\).*Request\s*:\s*\{.*"id":"' + app + r'"', "EIM_NATIVE_LAUNCH_REQUEST_BOOT_UPTIME_SECONDS"),
              (r'DEBUG\(\s*([0-9.]+)\).*foregroundAppId:' + app, "EIM_FOREGROUND_BOOT_UPTIME_SECONDS"),
          ]
          found = 0
          for pattern, label in patterns:
              match = re.search(pattern, text)
              if match:
                  print(f"{label}={match.group(1)}")
                  found += 1
          if not found:
              raise SystemExit("probe app not found in bootd.log")
          PY

          TIMING=""
          for i in $(seq 1 80); do
            TIMING="$(node tools/lab/measure-launcher-cdp.mjs "$APP_ID" 2>/dev/null || true)"
            if [ -n "$TIMING" ]; then
              echo "PROBE_CDP_SEEN_AFTER_SSH_HALFSECONDS=$i"
              break
            fi
            sleep 0.5
          done
          echo "PROBE_CDP_TIMING=$TIMING"

          TV_NOW="$("${SSH[@]}" 'date +%s')"
          CURRENT_UPTIME="$("${SSH[@]}" "cut -d' ' -f1 /proc/uptime")"
          echo "CURRENT_BOOT_UPTIME_SECONDS=$CURRENT_UPTIME"
          if [ -n "$TIMING" ]; then
            python3 - "$TIMING" "$TV_NOW" "$CURRENT_UPTIME" <<'PY'
          import json
          import sys
          timing = json.loads(sys.argv[1])
          now = float(sys.argv[2])
          uptime = float(sys.argv[3])
          for key, label in (
              ("navigation", "EIM_CDP_NAVIGATION_BOOT_UPTIME_SECONDS"),
              ("start", "EIM_CDP_APP_START_BOOT_UPTIME_SECONDS"),
              ("ready", "EIM_CDP_READY_BOOT_UPTIME_SECONDS"),
              ("paint", "EIM_CDP_FIRST_PAINT_BOOT_UPTIME_SECONDS"),
          ):
              value = timing.get(key)
              if isinstance(value, (int, float)):
                  print(f"{label}={uptime - ((now * 1000 - value) / 1000.0):.3f}")
          PY
          fi

          GUARD_EPOCH="$("${SSH[@]}" 'cat /tmp/hu.szabi.launcher.last-launch 2>/dev/null || true')"
          echo "PRODUCTION_GUARD_LAST_LAUNCH_EPOCH=$GUARD_EPOCH"
          echo EIM_REBOOT_MEASUREMENT=PASS

          luna_file delete_device com.webos.service.eim/deleteDevice "{\"appId\":\"$APP_ID\"}"
          DELETE="$(extract_json "$TMP/delete_device.txt" 2>/dev/null || true)"
          echo "DELETE_DEVICE=$DELETE"

          luna_file restore_hdmi com.webos.service.applicationmanager/launch "{\"id\":\"$HDMI_APP\",\"params\":{\"source\":\"eim-probe-restore\"}}"
          sleep 2

          "${SCP[@]}" "$BACKUP/eim_device_db.json" "$TV:/tmp/eim_device_db.baseline.json"
          "${SCP[@]}" "$BACKUP/lastinput" "$TV:/tmp/eim_lastinput.baseline"
          "${SSH[@]}" "cp /tmp/eim_device_db.baseline.json /var/lib/eim/eim_device_db.json; cp /tmp/eim_lastinput.baseline /var/lib/eim/lastinput; chmod 644 /var/lib/eim/eim_device_db.json /var/lib/eim/lastinput; rm -f /tmp/eim_device_db.baseline.json /tmp/eim_lastinput.baseline"

          "${SSH[@]}" "/usr/bin/luna-send-pub -t 1 -w 30000 -f 'luna://com.webos.appInstallService/dev/remove' '{\"id\":\"$APP_ID\",\"subscribe\":true}'" >/dev/null 2>&1 || true
          probe_installed=0

          luna_file final_last com.webos.service.eim/getLastInput '{}'
          FINAL_LAST="$(extract_json "$TMP/final_last.txt" 2>/dev/null || true)"
          echo "FINAL_GET_LAST_INPUT=$FINAL_LAST"
          echo "$FINAL_LAST" | grep -q '"lastSourceAppId":"com.webos.app.hdmi2"'

          FINAL_DB_SHA="$("${SSH[@]}" 'sha256sum /var/lib/eim/eim_device_db.json | cut -d" " -f1')"
          FINAL_LAST_SHA="$("${SSH[@]}" 'sha256sum /var/lib/eim/lastinput | cut -d" " -f1')"
          BASE_DB_SHA="$(sha256sum "$BACKUP/eim_device_db.json" | cut -d' ' -f1)"
          BASE_LAST_SHA="$(sha256sum "$BACKUP/lastinput" | cut -d' ' -f1)"
          echo "BASE_DB_SHA=$BASE_DB_SHA"
          echo "FINAL_DB_SHA=$FINAL_DB_SHA"
          echo "BASE_LASTINPUT_SHA=$BASE_LAST_SHA"
          echo "FINAL_LASTINPUT_SHA=$FINAL_LAST_SHA"
          test "$FINAL_DB_SHA" = "$BASE_DB_SHA"
          test "$FINAL_LAST_SHA" = "$BASE_LAST_SHA"

          luna_file final_settings com.webos.settingsservice/getSystemSettings '{"category":"general","keys":["lastInputApp","physicalLastInputApp"],"subscribe":false}'
          FINAL_SETTINGS="$(extract_json "$TMP/final_settings.txt" 2>/dev/null || true)"
          echo "FINAL_GENERAL_SETTINGS=$FINAL_SETTINGS"

          "${SSH[@]}" "test ! -e /media/developer/apps/usr/palm/applications/$APP_ID/appinfo.json"
          "${SSH[@]}" "rm -rf '$REMOTE'" || true
          restore_needed=0
          echo EIM_RESTORE=PASS
          echo PROBE_REMOVE=PASS
          echo PRODUCTION_LAUNCHER_UNCHANGED=PASS

          trap 'rm -rf "$TMP"' EXIT
