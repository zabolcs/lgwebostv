name: Controlled bootup Activity Manager reboot test

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/activity-manager-bootup-reboot-test.yml'

permissions:
  contents: read

jobs:
  reboot-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Controlled reboot and bootup callback measurement
        shell: bash
        run: |
          set -euo pipefail

          MARKER=/media/lgtv/rollback-20260925-pre-activity-manager/COMPLETE
          test -f "$MARKER"

          TV_HOST=192.168.0.240
          TV=root@"$TV_HOST"
          SOURCE_KEY=/media/lgtv/id_rsa
          SERVICE_ID=hu.szabi.launcher.startupprobe.service
          ACTIVITY_ID=483

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          KEY="$TMP/id_rsa"
          KNOWN="$TMP/known_hosts"

          test -f "$SOURCE_KEY"
          cp "$SOURCE_KEY" "$KEY"
          chmod 600 "$KEY"
          ssh-keyscan -T 3 "$TV_HOST" >"$KNOWN" 2>/dev/null
          test -s "$KNOWN"

          SSH=(ssh -T -i "$KEY" -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" "$TV")

          ssh_ok() {
            "${SSH[@]}" 'true' >/dev/null 2>&1
          }

          luna_json() {
            local uri="$1"
            local payload="$2"
            local out="$TMP/luna.txt"
            "${SSH[@]}" "luna-send -t 1 -f -w 5000 'luna://$uri' '$payload' 2>&1" >"$out"
            python3 - "$out" <<'PY'
          import json
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          decoder = json.JSONDecoder()
          found = None
          for line in reversed(text.splitlines()):
              for index, char in enumerate(line):
                  if char != "{":
                      continue
                  try:
                      candidate, _ = decoder.raw_decode(line[index:])
                  except json.JSONDecodeError:
                      continue
                  if isinstance(candidate, dict):
                      found = candidate
                      break
              if found is not None:
                  break
          if found is None:
              raise SystemExit("no JSON response")
          print(json.dumps(found, separators=(",", ":")))
          PY
          }

          echo ROLLBACK_BASELINE=PASS
          ssh_ok
          echo TV_SSH_BEFORE=PASS

          PRE_UPTIME="$("${SSH[@]}" "cut -d' ' -f1 /proc/uptime")"
          echo "PRE_REBOOT_UPTIME_SECONDS=$PRE_UPTIME"

          PRE_STATUS="$(luna_json "$SERVICE_ID/status" '{}')"
          echo "PRE_REBOOT_STATUS=$PRE_STATUS"
          echo "$PRE_STATUS" | grep -q '"returnValue":true'

          PRE_DETAILS="$(luna_json com.palm.activitymanager/getDetails "{\"activityId\":$ACTIVITY_ID,\"current\":false,\"internal\":false}")"
          echo "PRE_REBOOT_ACTIVITY_DETAILS=$PRE_DETAILS"
          echo "$PRE_DETAILS" | grep -q '"returnValue":true'
          echo "$PRE_DETAILS" | grep -q '"bootup"'
          echo "$PRE_DETAILS" | grep -q "$SERVICE_ID/probe"
          echo PRE_REBOOT_ACTIVITY_VERIFIED=PASS

          REBOOT_REQUEST_EPOCH="$(date +%s)"
          echo "REBOOT_REQUEST_EPOCH=$REBOOT_REQUEST_EPOCH"
          "${SSH[@]}" 'sync; reboot' >/dev/null 2>&1 || true
          echo REBOOT_COMMAND_SENT=PASS

          DROPPED=0
          for i in $(seq 1 45); do
            if ! ssh_ok; then
              DROPPED=1
              echo "SSH_DROPPED_AFTER_SECONDS=$i"
              break
            fi
            sleep 1
          done
          test "$DROPPED" -eq 1
          echo TV_SSH_DROP=PASS

          RETURNED=0
          for i in $(seq 1 180); do
            if ssh_ok; then
              RETURNED=1
              echo "SSH_RETURNED_AFTER_SECONDS=$i"
              break
            fi
            sleep 1
          done
          test "$RETURNED" -eq 1
          echo TV_SSH_AFTER=PASS

          POST_UPTIME="$("${SSH[@]}" "cut -d' ' -f1 /proc/uptime")"
          echo "POST_REBOOT_UPTIME_SECONDS=$POST_UPTIME"

          CALLBACK_SEEN=0
          STATUS=""
          for i in $(seq 1 60); do
            STATUS="$(luna_json "$SERVICE_ID/status" '{}' 2>/dev/null || true)"
            if [ -n "$STATUS" ]; then
              KIND="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print((((d.get("state") or {}).get("lastProbe") or {}).get("kind")) or "")' "$STATUS")"
              if [ "$KIND" = "bootup" ]; then
                CALLBACK_SEEN=1
                echo "BOOTUP_CALLBACK_SEEN_AFTER_SSH_SECONDS=$i"
                break
              fi
            fi
            sleep 1
          done

          echo "POST_REBOOT_STATUS=$STATUS"
          test "$CALLBACK_SEEN" -eq 1

          CALLBACK_UPTIME="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print((((d.get("state") or {}).get("lastProbe") or {}).get("bootUptimeSeconds")) or "")' "$STATUS")"
          CALLBACK_EPOCH_MS="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print((((d.get("state") or {}).get("lastProbe") or {}).get("epochMs")) or "")' "$STATUS")"
          test -n "$CALLBACK_UPTIME"
          test -n "$CALLBACK_EPOCH_MS"
          echo BOOTUP_CALLBACK=PASS
          echo "CALLBACK_BOOT_UPTIME_SECONDS=$CALLBACK_UPTIME"
          echo "CALLBACK_EPOCH_MS=$CALLBACK_EPOCH_MS"

          POST_DETAILS="$(luna_json com.palm.activitymanager/getDetails "{\"activityId\":$ACTIVITY_ID,\"current\":false,\"internal\":false}")"
          echo "POST_REBOOT_ACTIVITY_DETAILS=$POST_DETAILS"
          echo "$POST_DETAILS" | grep -q '"returnValue":true'
          echo "$POST_DETAILS" | grep -q '"bootup"'
          echo "$POST_DETAILS" | grep -q "$SERVICE_ID/probe"
          echo POST_REBOOT_ACTIVITY_VERIFIED=PASS

          echo PRODUCTION_LAUNCHER_UNCHANGED=PASS
