name: Arm persistent bootup Activity Manager probe

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  arm:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build, install and arm bootup probe
        shell: bash
        run: |
          set -euo pipefail
          MARKER=/media/lgtv/rollback-20260925-pre-activity-manager/COMPLETE
          test -f "$MARKER"
          APP_ID=hu.szabi.launcher.startupprobe
          SERVICE_ID=hu.szabi.launcher.startupprobe.service
          TV_HOST=192.168.0.240
          TV=root@"$TV_HOST"
          SOURCE_KEY=/media/lgtv/id_rsa
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          KEY="$TMP/id_rsa"
          KNOWN="$TMP/known_hosts"
          test -f "$SOURCE_KEY"
          cp "$SOURCE_KEY" "$KEY"
          chmod 600 "$KEY"
          ssh-keyscan -T 3 "$TV_HOST" >"$KNOWN" 2>/dev/null
          test -s "$KNOWN"
          SSH=(ssh -T -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" "$TV")
          SCP=(scp -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN")

          "${SSH[@]}" 'command -v luna-send >/dev/null'
          echo TV_SSH=PASS

          luna_file() {
            local label="$1"
            local uri="$2"
            local payload="$3"
            "${SSH[@]}" "luna-send -t 1 -f -w 5000 'luna://$uri' '$payload' 2>&1" \
              > "$TMP/$label.txt"
          }

          extract_json() {
            python3 - "$1" <<'PY'
          import json
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          decoder = json.JSONDecoder()
          found = None
          for line in reversed(text.splitlines()):
              for index, char in enumerate(line):
                  if char != "{":
                      continue
                  try:
                      candidate, _ = decoder.raw_decode(line[index:])
                  except json.JSONDecodeError:
                      continue
                  if isinstance(candidate, dict):
                      found = candidate
                      break
              if found is not None:
                  break
          if found is None:
              raise SystemExit("no JSON response")
          print(json.dumps(found, separators=(",", ":")))
          PY
          }
          luna_file power com.webos.service.tvpower/power/getPowerState '{}' || true
          POWER_JSON="$(extract_json "$TMP/power.txt" 2>/dev/null || true)"
          echo "POWER_JSON=$POWER_JSON"
          echo POWER_CHECK=DIAGNOSTIC_ONLY

          python3 tools/lab/build-launcher-startup-probe.py >"$TMP/build.txt"
          IPK=$(find build -maxdepth 1 -type f -name 'hu.szabi.launcher.startupprobe_*.ipk' | head -1)
          test -n "$IPK"
          REMOTE=/tmp/hu.szabi.bootup-arm.$$
          "${SSH[@]}" "mkdir -p '$REMOTE'"
          "${SCP[@]}" "$IPK" "$TV:$REMOTE/probe.ipk"
          "${SCP[@]}" scripts/install-local-on-tv.sh "$TV:$REMOTE/install.sh"
          SHA=$(sha256sum "$IPK" | awk '{print $1}')
          "${SSH[@]}" "chmod 700 '$REMOTE/install.sh'; sh '$REMOTE/install.sh' '$REMOTE/probe.ipk' '$SHA'"
          echo PROBE_INSTALL=PASS

          # First call activates the dynamic service on this firmware.
          luna_file status_before "$SERVICE_ID/status" '{}' || true
          STATUS="$(extract_json "$TMP/status_before.txt" 2>/dev/null || true)"
          if ! echo "$STATUS" | grep -q '"returnValue":true'; then
            "${SSH[@]}" "/usr/bin/run-js-service -n '/media/developer/apps/usr/palm/services/$SERVICE_ID' >/tmp/startupprobe-activate.log 2>&1 &" || true
            sleep 2
            luna_file status_before_retry "$SERVICE_ID/status" '{}' || true
            STATUS="$(extract_json "$TMP/status_before_retry.txt" 2>/dev/null || true)"
          fi
          echo "STATUS_BEFORE=$STATUS"
          echo "$STATUS" | grep -q '"returnValue":true'
          echo SERVICE_STATUS=PASS

          EXISTING_ACTIVITY_ID="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print((((d.get("state") or {}).get("lastBootupArm") or {}).get("activityId")) or "")' "$STATUS")"
          ACTIVITY_ID=""
          if [ -n "$EXISTING_ACTIVITY_ID" ]; then
            echo "BOOTUP_ACTIVITY_CANDIDATE=$EXISTING_ACTIVITY_ID"
            luna_file existing_activity_details com.palm.activitymanager/getDetails "{\"activityId\":$EXISTING_ACTIVITY_ID,\"current\":false,\"internal\":false}" || true
            EXISTING_INFO="$(extract_json "$TMP/existing_activity_details.txt" 2>/dev/null || true)"
            echo "BOOTUP_ACTIVITY_CANDIDATE_DETAILS=$EXISTING_INFO"
            if echo "$EXISTING_INFO" | grep -q '"returnValue":true' \
              && echo "$EXISTING_INFO" | grep -q '"bootup"' \
              && echo "$EXISTING_INFO" | grep -q "$SERVICE_ID/probe"; then
              ACTIVITY_ID="$EXISTING_ACTIVITY_ID"
              INFO="$EXISTING_INFO"
              echo BOOTUP_ACTIVITY_REUSED=YES
            else
              echo BOOTUP_ACTIVITY_REUSED=NO
            fi
          fi

          if [ -z "$ACTIVITY_ID" ]; then
            luna_file arm_bootup "$SERVICE_ID/armBootup" '{"manager":"palm"}'
            ARM="$(extract_json "$TMP/arm_bootup.txt")"
            echo "ARM_BOOTUP=$ARM"
            echo "$ARM" | grep -q '"returnValue":true'
            ACTIVITY_ID="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("activityId",""))' "$ARM")"
            test -n "$ACTIVITY_ID"
            luna_file activity_details com.palm.activitymanager/getDetails "{\"activityId\":$ACTIVITY_ID,\"current\":false,\"internal\":false}"
            INFO="$(extract_json "$TMP/activity_details.txt")"
          fi

          echo "BOOTUP_ACTIVITY_ID=$ACTIVITY_ID"
          echo "BOOTUP_ACTIVITY_DETAILS=$INFO"
          echo "$INFO" | grep -q '"returnValue":true'
          echo "$INFO" | grep -q '"bootup"'
          echo "$INFO" | grep -q "$SERVICE_ID/probe"
          echo BOOTUP_ACTIVITY_VERIFIED=PASS

          "${SSH[@]}" "rm -rf '$REMOTE'"
          echo PROBE_LEFT_INSTALLED_FOR_REBOOT=YES
          echo PRODUCTION_LAUNCHER_UNCHANGED=PASS
