name: Inspect factory smartdemokit Activity Manager launch

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/activity-manager-factory-launch-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

# trigger: overlay boot log diagnosis
# trigger: overlay confirm diagnosis

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Read-only factory activity inspection
        shell: bash
        run: |
          set -euo pipefail

          TV_HOST=192.168.0.240
          TV=root@"$TV_HOST"
          SOURCE_KEY=/media/lgtv/id_rsa
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          KEY="$TMP/id_rsa"
          KNOWN="$TMP/known_hosts"

          cp "$SOURCE_KEY" "$KEY"
          chmod 600 "$KEY"
          ssh-keyscan -T 3 "$TV_HOST" >"$KNOWN" 2>/dev/null
          test -s "$KNOWN"
          SSH=(ssh -T -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" "$TV")

          "${SSH[@]}" true
          echo TV_SSH=PASS

          echo '=== DIRECT TEST ACTIVITY ID 103 ==='
          "${SSH[@]}" "luna-send -t 1 -f -w 4000 'luna://com.palm.activitymanager/getDetails' '{\"activityId\":103,\"current\":false,\"internal\":false}' 2>&1" || true

          echo '=== MANAGER INFO ==='
          "${SSH[@]}" "luna-send -t 1 -f -w 4000 'luna://com.palm.activitymanager/getManagerInfo' '{}' 2>&1" || true

          echo '=== SMARTDEMOKIT / ACTIVITY MANAGER ROLE REFERENCES ==='
          "${SSH[@]}" "grep -R -n -E 'demo\.smartdemokit|smartdemokit|activitymanager|applicationmanager/launch|getBootStatus' /usr/share/luna-service2/roles.d /usr/share/luna-service2/client-permissions.d /var/luna-service2/roles.d /var/luna-service2/client-permissions.d 2>/dev/null | head -240 || true"

          echo '=== SMARTDEMOKIT APPINFO/SERVICE REFERENCES ==='
          "${SSH[@]}" "grep -R -n -E 'smartdemokit|demo\.smartdemokit' /usr/palm /media/cryptofs/apps /media/developer/apps 2>/dev/null | head -160 || true"

          echo '=== EARLY BOOT / POWER ACTIVITIES ==='
          for name in \
            adoverlay_wake_up_by_power_on \
            acr_wake_up_by_power_on \
            com.webos.service.admanager.InstantBootComplete \
            com.webos.service.wasupolicymanager.start \
            com.webos.service.tvdataexchanger
          do
            echo "--- ACTIVITY_NAME=$name ---"
            "${SSH[@]}" "luna-send -t 1 -f -w 4000 'luna://com.palm.activitymanager/getDetails' '{\"activityName\":\"$name\",\"current\":true,\"internal\":true}' 2>&1" || true
          done

          echo '=== EARLY ACTIVITIES BY CURRENT ID ==='
          for id in 5 6 64 66 108
          do
            echo "--- ACTIVITY_ID=$id ---"
            "${SSH[@]}" "luna-send -t 1 -f -w 4000 'luna://com.palm.activitymanager/getDetails' '{\"activityId\":$id,\"current\":true,\"internal\":true}' 2>&1" || true
          done

          echo '=== ALL ACTIVITIES USING BOOT MANAGER / EARLY SIGNALS ==='
          MANAGER_RAW="$TMP/manager-scan.txt"
          "${SSH[@]}" "luna-send -t 1 -f -w 4000 'luna://com.palm.activitymanager/getManagerInfo' '{}' 2>&1" >"$MANAGER_RAW" || true
          IDS="$(python3 - "$MANAGER_RAW" <<'PY'
          import json, sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding="utf-8",errors="replace")
          dec=json.JSONDecoder()
          data=None
          for line in reversed(text.splitlines()):
              for i,ch in enumerate(line):
                  if ch!="{":
                      continue
                  try:
                      obj,_=dec.raw_decode(line[i:])
                  except json.JSONDecodeError:
                      continue
                  if isinstance(obj,dict) and "queues" in obj:
                      data=obj
                      break
              if data is not None:
                  break
          ids=[]
          for q in (data or {}).get("queues",[]):
              for a in q.get("activities",[]):
                  if isinstance(a,dict) and isinstance(a.get("activityId"),int):
                      ids.append(a["activityId"])
          print(" ".join(map(str,sorted(set(ids)))))
          PY
          )"
          for id in $IDS
          do
            OUT="$TMP/detail-$id.txt"
            "${SSH[@]}" "luna-send -t 1 -f -w 2500 'luna://com.palm.activitymanager/getDetails' '{\"activityId\":$id,\"current\":true,\"internal\":false}' 2>&1" >"$OUT" || true
            if grep -Eq 'bootManager|getBootStatus|minimal-boot-done|core-boot-done|init-boot-done|rest-boot-done|boot-done|firstAppLaunched' "$OUT"; then
              echo "--- MATCH_ACTIVITY_ID=$id ---"
              cat "$OUT"
            fi
          done

          echo '=== RAW BOOT-MANAGER ACTIVITY DEFINITIONS ==='
          for id in 3 4 15
          do
            echo "--- RAW_ACTIVITY_ID=$id ---"
            "${SSH[@]}" "luna-send -t 1 -f -w 4000 'luna://com.palm.activitymanager/getDetails' '{\"activityId\":$id,\"current\":false,\"internal\":false}' 2>&1" || true
          done

          echo '=== BOOT MANAGER CURRENT STATUS ==='
          "${SSH[@]}" "luna-send -t 1 -f -w 4000 'luna://com.webos.bootManager/getBootStatus' '{}' 2>&1" || true

          echo '=== BOOT LOG EARLY SIGNALS ==='
          "${SSH[@]}" "grep -n -E 'minimal-boot-done|core-boot-done|init-boot-done|rest-boot-done|boot-done|snapshot-resume-done|firstAppLaunched|InstantBootComplete|power.?on|Power.?On' /var/log/bootd.log /var/log/messages 2>/dev/null | tail -240 || true"

          echo '=== EARLY ACTIVITY DEFINITIONS / SOURCES ==='
          "${SSH[@]}" "grep -R -n -E 'adoverlay_wake_up_by_power_on|acr_wake_up_by_power_on|InstantBootComplete|firstAppLaunched|minimal-boot-done|core-boot-done|rest-boot-done' /usr/palm/services /usr/share/luna-service2 /var/luna-service2 2>/dev/null | head -320 || true"

          echo '=== APPLICATION MANAGER / WAM BOOT TIMELINE ==='
          "${SSH[@]}" "grep -n -i -E 'applicationManager|applicationmanager|webappmanager|WebAppMgr|WAM|SAM|surface.*manager|launch.*app|app.*launch' /var/log/bootd.log /var/log/messages 2>/dev/null | head -360 || true"

          echo '=== BOOTD WINDOW AROUND CORE/MINIMAL/REST ==='
          "${SSH[@]}" "sed -n '170,370p' /var/log/bootd.log 2>/dev/null || true"

          echo '=== FIRST APP BOOT SEQUENCE EXACT WINDOW ==='
          "${SSH[@]}" "sed -n '185,275p' /var/log/bootd.log 2>/dev/null || true"

          echo '=== FIRST APP / HOME AUTOLAUNCH CONFIG REFERENCES ==='
          "${SSH[@]}" "grep -R -n -i -E 'firstAppId|firstapp-launched|Try to launch first app|homeAutoLaunch|CoverAppLaunchAction|FirstAppLaunch|checkHomeAutoLaunchValue' /etc /usr/palm /usr/share 2>/dev/null | head -320 || true"

          echo '=== HOTEL AUTO-BROWSER / POWER-ON REFERENCES ==='
          "${SSH[@]}" "grep -R -n -i -E 'autoBrowserUrl|enableAutoBrowser|powerOnDefaultAv|Hotel Input App|Auto Browser' /etc /usr/palm /usr/share /var 2>/dev/null | head -360 || true"

          echo '=== CURRENT HOTEL / GENERAL BOOT SETTINGS ==='
          "${SSH[@]}" "luna-send -t 1 -f -w 4000 'luna://com.webos.settingsservice/getSystemSettings' '{\"category\":\"general\",\"keys\":[\"homeAutoLaunch\",\"checkHomeAutoLaunchValue\",\"checkForcedInputPowerOn\"],\"subscribe\":false}' 2>&1" || true
          "${SSH[@]}" "luna-send -t 1 -f -w 4000 'luna://com.webos.settingsservice/getSystemSettings' '{\"category\":\"hotelMode\",\"keys\":[\"enableAutoBrowser\",\"autoBrowserUrl\",\"powerOnDefaultAv\",\"powerOnStatus\"],\"subscribe\":false}' 2>&1" || true

          echo '=== FIRST-APP SETTING DISCOVERY ==='
          "${SSH[@]}" "luna-send -t 1 -f -w 5000 'luna://com.webos.settingsservice/getSystemSettings' '{\"category\":\"hotelMode\",\"subscribe\":false}' 2>&1" || true
          "${SSH[@]}" "luna-send -t 1 -f -w 5000 'luna://com.webos.settingsservice/getSystemSettings' '{\"category\":\"general\",\"subscribe\":false}' 2>&1" || true

          echo '=== BOOTD / FIRST APP STRING REFERENCES ==='
          "${SSH[@]}" "for f in /usr/palm/services/com.webos.bootManager/* /usr/bin/*boot* /usr/sbin/*boot*; do test -f \"\$f\" || continue; echo ---\$f; strings \"\$f\" 2>/dev/null | grep -i -E 'Last Input App|HotelMode Default App|HotelMode Default Input|powerOnDefaultAv|powerOnStatus|autoBrowser|homeAutoLaunch|first app|firstAppId' | head -160 || true; done"

          echo '=== SETTINGS / PREF FILE REFERENCES ==='
          "${SSH[@]}" "grep -R -n -i -E 'powerOnDefaultAv|powerOnStatus|defaultApp|lastInput|last input|firstAppId|homeAutoLaunch|autoBrowserUrl|enableAutoBrowser' /var/luna /var/palm /var/preferences /etc/palm /usr/palm 2>/dev/null | head -400 || true"

          echo '=== EIM INPUT-APP AUTOSTART CAPABILITY ==='
          "${SSH[@]}" "ls-monitor -l 2>/dev/null | grep -E 'com\.webos\.service\.eim|eim' || true"
          "${SSH[@]}" "ls-monitor -i com.webos.service.eim 2>/dev/null | head -240 || true"
          "${SSH[@]}" "echo ---/var/lib/eim---; ls -la /var/lib/eim 2>/dev/null || true; echo ---lastinput---; cat /var/lib/eim/lastinput 2>/dev/null || true"
          "${SSH[@]}" "echo ---eim-files---; find /var/lib/eim -maxdepth 2 -type f -print 2>/dev/null | sort | head -200"
          "${SSH[@]}" "echo ---launcher-appinfo---; cat /media/developer/apps/usr/palm/applications/hu.szabi.launcher/appinfo.json 2>/dev/null || true"

          echo '=== EIM DEVICE DB / API BASELINE ==='
          "${SSH[@]}" "echo ---eim_device_db.json---; cat /var/lib/eim/eim_device_db.json 2>/dev/null || true"
          "${SSH[@]}" "echo ---getLastInput---; luna-send -t 1 -f -w 4000 'luna://com.webos.service.eim/getLastInput' '{}' 2>&1 || true"
          "${SSH[@]}" "echo ---getTotalDeviceList---; luna-send -t 1 -f -w 4000 'luna://com.webos.service.eim/getTotalDeviceList' '{}' 2>&1 || true"

          echo '=== WEBOS / HOMEBREW AUTOSTART CAPABILITY ==='
          "${SSH[@]}" "echo ---webos-release---; cat /etc/webos-release 2>/dev/null || true"
          "${SSH[@]}" "echo ---hb-package---; cat /media/developer/apps/usr/palm/services/org.webosbrew.hbchannel.service/package.json 2>/dev/null || cat /media/cryptofs/apps/usr/palm/services/org.webosbrew.hbchannel.service/package.json 2>/dev/null || true"
          "${SSH[@]}" "echo ---hb-services---; cat /media/developer/apps/usr/palm/services/org.webosbrew.hbchannel.service/services.json 2>/dev/null || cat /media/cryptofs/apps/usr/palm/services/org.webosbrew.hbchannel.service/services.json 2>/dev/null || true"
          "${SSH[@]}" "echo ---hb-activity---; luna-send -t 1 -f -w 4000 'luna://com.palm.activitymanager/getDetails' '{\"activityName\":\"org.webosbrew.hbchannel.service.autostart\",\"creator\":{\"serviceId\":\"org.webosbrew.hbchannel.service\"},\"current\":false,\"internal\":false}' 2>&1 || true"

          echo '=== PRODUCTION EIM OVERLAY PREFLIGHT ==='
          "${SSH[@]}" "echo ---lastinput---; cat /var/lib/eim/lastinput 2>/dev/null || true"
          "${SSH[@]}" "echo ---getLastInput---; luna-send -t 1 -f -w 4000 'luna://com.webos.service.eim/getLastInput' '{}' 2>&1 || true"
          "${SSH[@]}" "echo ---device-db-launcher---; grep -n 'hu.szabi.launcher' /var/lib/eim/eim_device_db.json 2>/dev/null || true"
          "${SSH[@]}" "echo ---mount-eim---; findmnt /var/lib/eim 2>/dev/null || true"
          "${SSH[@]}" "echo ---init-hooks---; ls -la /var/lib/webosbrew/init.d 2>/dev/null || true"
          "${SSH[@]}" "echo ---webosbrew-startup---; test -f /tmp/webosbrew_startup && echo startup-done || echo startup-not-done"

          echo '=== EIM OVERLAY CURRENT STATE ==='
          "${SSH[@]}" "echo ---mounts---; findmnt /var/lib/eim 2>/dev/null || true; findmnt /var/lib/webosbrew/launcher-eim/frozen-view 2>/dev/null || true"
          "${SSH[@]}" "echo ---base---; ls -la /var/lib/webosbrew/launcher-eim 2>/dev/null || true"
          "${SSH[@]}" "echo ---hook---; ls -l /var/lib/webosbrew/init.d/launcher-eim-overlay 2>/dev/null || true"
          "${SSH[@]}" "echo ---markers---; for f in enabled boot-pending last-good disabled-failsafe; do printf '%s=' \"\$f\"; test -e /var/lib/webosbrew/launcher-eim/\"\$f\" && cat /var/lib/webosbrew/launcher-eim/\"\$f\" || echo absent; done"
          "${SSH[@]}" "echo ---live-lastinput---; cat /var/lib/eim/lastinput 2>/dev/null || true"
          "${SSH[@]}" "echo ---overlay-log---; tail -80 /tmp/hu.szabi.launcher-eim-overlay.log 2>/dev/null || true"
          "${SSH[@]}" "echo ---uptime---; cat /proc/uptime"

          echo '=== ACTUAL WEBOSBREW STARTUP CHAIN ==='
          "${SSH[@]}" "echo ---startup-sh---; sed -n '1,240p' /var/lib/webosbrew/startup.sh 2>/dev/null || true"
          "${SSH[@]}" "echo ---jumpstart-candidates---; for p in /var/lib/webosbrew/jumpstart.sh /media/developer/apps/usr/palm/services/org.webosbrew.hbchannel.service/startup.sh /media/cryptofs/apps/usr/palm/services/org.webosbrew.hbchannel.service/startup.sh; do if test -f \"\$p\"; then echo ---\$p; grep -n -E 'init\.d|run-parts|webosbrew_startup|failsafe|startup' \"\$p\" | head -120; fi; done"
          "${SSH[@]}" "echo ---run-parts-test---; if test -d /var/lib/webosbrew/init.d; then run-parts --test /var/lib/webosbrew/init.d 2>&1 || true; ls -la /var/lib/webosbrew/init.d; fi"
          "${SSH[@]}" "echo ---startup-marker---; stat /tmp/webosbrew_startup 2>/dev/null || true"

          echo '=== HDMI BOUNCE TIMING ==='
          "${SSH[@]}" "grep -n -E 'com\.webos\.app\.hdmi2|NL_APP_LAUNCH_BEGIN|NL_VSC' /var/log/messages 2>/dev/null | tail -160 || true"

          echo '=== DIRECT REBOOT POSTMORTEM ==='
          "${SSH[@]}" "date +%s; cat /proc/uptime"
          "${SSH[@]}" "luna-send -t 1 -f -w 4000 'luna://com.palm.activitymanager/getDetails' '{\"activityId\":103,\"current\":false,\"internal\":false}' 2>&1" || true
          "${SSH[@]}" "if test -e /media/developer/apps/usr/palm/applications/hu.szabi.launcher.startupprobe/appinfo.json || test -e /media/developer/apps/usr/palm/services/hu.szabi.launcher.startupprobe.service/services.json; then echo PROBE_PRESENT=yes; else echo PROBE_PRESENT=no; fi"

          echo FACTORY_INSPECTION_COMPLETE=PASS
