name: Deploy current guard

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/deploy-current-guard.yml'

permissions:
  contents: read

# long-back guard redeploy

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy guard
        run: python3 tools/lab/deploy-current-guard.py

      - name: Verify factory Home replacement
        shell: bash
        run: |
          set -euo pipefail
          KNOWN="$(mktemp)"
          trap 'rm -f "$KNOWN"' EXIT
          ssh-keyscan -T 3 192.168.0.240 >"$KNOWN" 2>/dev/null
          SSH=(ssh -T -i /media/lgtv/id_rsa -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" root@192.168.0.240)
          "${SSH[@]}" "luna-send-pub -n 1 -w 3000 -f luna://com.webos.applicationManager/launch '{\"id\":\"com.webos.app.home\",\"params\":{}}' >/dev/null"
          ok=0
          last=""
          for i in {1..20}; do
            out="$("${SSH[@]}" "luna-send -n 1 -w 1500 -f luna://com.webos.applicationManager/getForegroundAppInfo '{}' 2>/dev/null || true")"
            last="$out"
            if grep -Eq '"appId"[[:space:]]*:[[:space:]]*"hu[.]szabi[.]launcher([.]overlay)?"' <<<"$out"; then
              ok=1
              break
            fi
            sleep 0.15
          done
          if [ "$ok" -ne 1 ]; then
            echo "FOREGROUND_FINAL=$last"
            surface="$("${SSH[@]}" "luna-send -n 1 -w 1500 -f luna://com.webos.surfacemanager/getForegroundWindowInfo '{}' 2>/dev/null || true")"
            echo "SURFACE_FINAL=$surface"
            "${SSH[@]}" 'for f in enabled home-mode full-presentation; do printf "%s=" "$f"; cat "/var/lib/webosbrew/launcher-home/$f" 2>/dev/null || echo missing; done
              for f in power-state boot-ready power-startup wake-signal home-active allow-home full-close-suppress foreground last-launch; do
                p="/tmp/hu.szabi.launcher.$f"
                if [ -e "$p" ]; then printf "%s=" "$f"; cat "$p" 2>/dev/null || echo present; else echo "$f=missing"; fi
              done
              echo "GUARD_PID=$(cat /tmp/hu.szabi.launcher-home.pid 2>/dev/null || echo missing)"
              echo "--- wake log tail ---"
              tail -n 40 /tmp/hu.szabi.launcher-wake.log 2>/dev/null || true'
            exit 1
          fi
          echo FACTORY_HOME_REPLACEMENT=PASS
