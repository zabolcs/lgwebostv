name: Restore long Back Input Hook

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/restore-long-back-inputhook.yml'
      - 'tools/lab/restore-long-back-inputhook.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false

      - name: Validate helper
        run: python3 -m py_compile tools/lab/restore-long-back-inputhook.py

      - name: Restore Input Hook
        run: python3 tools/lab/restore-long-back-inputhook.py
