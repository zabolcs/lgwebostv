name: Activity Manager read-only preflight

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/activity-manager-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read-only TV capability probe
        shell: bash
        run: |
          set -euo pipefail

          TV_HOST=192.168.0.240
          SOURCE_KEY=/media/lgtv/id_rsa
          test -f "$SOURCE_KEY"

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          KEY="$TMP/id_rsa"
          KNOWN="$TMP/known_hosts"

          cp "$SOURCE_KEY" "$KEY"
          chmod 600 "$KEY"
          ssh-keyscan -T 3 "$TV_HOST" > "$KNOWN" 2>/dev/null
          test -s "$KNOWN"

          SSH=(ssh -T
            -i "$KEY"
            -o BatchMode=yes
            -o ConnectTimeout=5
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN"
            root@"$TV_HOST"
          )

          "${SSH[@]}" 'command -v luna-send >/dev/null && test -r /proc/uptime'
          echo "TV_SSH=PASS"

          run_luna() {
            local label="$1"
            local uri="$2"
            local payload="$3"
            "${SSH[@]}" "luna-send -t 1 -f -w 2000 'luna://$uri' '$payload' 2>&1" \
              > "$TMP/$label.json"
          }

          run_luna activity com.webos.service.activitymanager/getManagerInfo '{}'
          run_luna boot com.webos.bootManager/getBootStatus '{}'
          run_luna power com.webos.service.tvpower/power/getPowerState '{}'
          run_luna foreground com.webos.service.applicationmanager/getForegroundAppInfo '{}'
          run_luna smartdemo com.palm.activitymanager/getDetails '{"activityName":"demo.smartdemokit.launch","current":true,"internal":true}' || true
          "${SSH[@]}" "grep -R -n -E 'demo.smartdemokit|smartdemokit|applicationmanager/launch|applicationManager/launch|getBootStatus' /usr/share/luna-service2 /var/luna-service2 /usr/palm/services 2>/dev/null | head -240 || true" > "$TMP/factory-refs.txt"
          "${SSH[@]}" 'cat /proc/uptime' > "$TMP/uptime.txt"

          python3 - "$TMP" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])

          def load(name):
              text = (root / name).read_text(encoding="utf-8", errors="replace").strip()
              if not text:
                  raise SystemExit(f"{name}: empty response")
              data = None
              decoder = json.JSONDecoder()
              for line in reversed(text.splitlines()):
                  for index, char in enumerate(line):
                      if char != "{":
                          continue
                      try:
                          candidate, _ = decoder.raw_decode(line[index:])
                      except json.JSONDecodeError:
                          continue
                      if isinstance(candidate, dict):
                          data = candidate
                          break
                  if data is not None:
                      break
              if data is None:
                  raise SystemExit(f"{name}: no JSON object in response")
              if data.get("returnValue") is False:
                  raise SystemExit(f"{name}: Luna call failed")
              return data

          activity = load("activity.json")
          boot = load("boot.json")
          power = load("power.json")
          foreground = load("foreground.json")
          try:
              smartdemo = load("smartdemo.json")
          except SystemExit:
              smartdemo = {}

          uptime_raw = (root / "uptime.txt").read_text().strip().split()[0]
          uptime = float(uptime_raw)

          requirements = activity.get("requirements")
          if isinstance(requirements, dict):
              requirement_names = sorted(str(k) for k in requirements)
          elif isinstance(requirements, list):
              requirement_names = sorted(
                  str(item.get("name", item)) if isinstance(item, dict) else str(item)
                  for item in requirements
              )
          else:
              requirement_names = []

          activity_names = []
          queues = activity.get("queues")
          if isinstance(queues, list):
              for queue in queues:
                  if not isinstance(queue, dict):
                      continue
                  activities = queue.get("activities")
                  if not isinstance(activities, list):
                      continue
                  for item in activities:
                      if isinstance(item, dict):
                          name = item.get("name") or item.get("activityName")
                          if name:
                              activity_names.append(str(name))

          print(f"UPTIME_SECONDS={uptime:.3f}")
          print("ACTIVITY_MANAGER=PASS")
          print("ACTIVITY_REQUIREMENTS=" + ",".join(requirement_names))
          print("SMARTDEMO_ACTIVITY_PRESENT=" + (
              "yes" if "demo.smartdemokit.launch" in activity_names else "no"
          ))
          for key in ("bootStatus", "firstAppLaunched", "returnValue"):
              if key in boot and isinstance(boot[key], (bool, str, int, float)):
                  print(f"BOOT_{key.upper()}={boot[key]}")
          for key in ("state", "processing", "onOff"):
              if key in power and isinstance(power[key], (bool, str, int, float)):
                  print(f"POWER_{key.upper()}={power[key]}")
          app_id = foreground.get("appId")
          if app_id is not None:
              print("FOREGROUND_APP=" + str(app_id)[:160])
          if smartdemo:
              print("SMARTDEMO_DETAILS=" + json.dumps(smartdemo, separators=(",", ":")))
          refs = (root / "factory-refs.txt").read_text(encoding="utf-8", errors="replace")
          if refs:
              print("FACTORY_REFS_BEGIN")
              print(refs[-16000:])
              print("FACTORY_REFS_END")
          PY
