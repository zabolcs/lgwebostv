name: Restore path discovery

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/restore-path-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Discover private restore transport metadata
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/media/lgtv/checkpoint-20260925-20260925-092443
          test -d "$ROOT"
          echo "ROLLBACK_COMPLETE=$(test -f /media/lgtv/rollback-20260925-pre-activity-manager/COMPLETE && echo yes || echo no)"
          echo "SSH_KEY_CANDIDATES:"
          find "$ROOT" -type f \( -name 'id_rsa' -o -name '*.key' -o -name '*ssh*key*' \) -printf '%P\n' 2>/dev/null | sort | head -100
          echo "RESTORE_SCRIPTS:"
          find "$ROOT" -type f \( -iname '*restore*' -o -iname '*remote.py' -o -iname '*deploy*.py' \) -printf '%P\n' 2>/dev/null | sort | head -200
          if python3 -c 'import paramiko' >/dev/null 2>&1; then
            echo "PYTHON_PARAMIKO=yes"
          else
            echo "PYTHON_PARAMIKO=no"
          fi
          echo "PARAMIKO_TREE_CANDIDATES:"
          find "$ROOT" -type d -name paramiko -path '*/site-packages/*' -printf '%P\n' 2>/dev/null | sort | head -20
          echo "PVE_CT_REFERENCES:"
          grep -RIlE '192\.168\.0\.120|192\.168\.0\.223|pct (exec|push|pull)|ct125' "$ROOT" 2>/dev/null             | sed "s#^$ROOT/##" | sort | head -200
