name: Deploy current launcher control

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/deploy-current-launcher-control.yml'
      - 'tools/lab/deploy-native-launcher.py'
      - 'remote-control/server.py'
      - 'remote-control/static/index.html'
      - 'remote-control/static/power-control.js'
      - 'remote-control/static/dashboard-control.js'
      - 'remote-control/static/launcher-admin.js'
      - 'remote-control/static/connections-ui.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false

      - name: Isolated Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install transport dependency
        run: python -m pip install --disable-pip-version-check --quiet 'paramiko==3.5.1'

      - name: Validate helper
        run: python -m py_compile tools/lab/deploy-native-launcher.py remote-control/server.py

      - name: Locate archived private transport metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "ARCHIVE_MATCH_BEGIN"
          while IFS= read -r archive; do
            case "$archive" in
              *.zip)
                entry="$(unzip -Z1 "$archive" 2>/dev/null | grep -m1 'CHECKPOINT-LGTV-2026-08-31.md' || true)"
                ;;
              *.tar.gz|*.tgz)
                entry="$(tar -tzf "$archive" 2>/dev/null | grep -m1 'CHECKPOINT-LGTV-2026-08-31.md' || true)"
                ;;
              *) entry="" ;;
            esac
            if [ -n "$entry" ]; then
              echo "MATCH_ARCHIVE=$archive"
              echo "MATCH_ENTRY=$entry"
              exit 0
            fi
          done < <(find /media/lgtv /home/actions/lgtv-import -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' \) -print 2>/dev/null)
          echo "MATCH_ARCHIVE=NONE"
          echo "ARCHIVE_MATCH_END"

      - name: Deploy NAS control UI
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_PY="$(find /media/lgtv /home/actions/lgtv-import -type f -path '*/tools/remote.py' -print -quit 2>/dev/null || true)"
          test -n "$REMOTE_PY" || { echo "remote.py checkpoint helper not found" >&2; exit 1; }
          echo "Using private transport helper."
          PYTHONPATH="$(dirname "$REMOTE_PY")${PYTHONPATH:+:$PYTHONPATH}" python tools/lab/deploy-native-launcher.py server.py static/index.html static/power-control.js static/launcher-admin.js static/connections-ui.js static/dashboard-control.js
