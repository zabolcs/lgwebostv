name: Deploy current launcher control

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/deploy-current-launcher-control.yml'
      - 'tools/lab/deploy-native-launcher.py'
      - 'remote-control/server.py'
      - 'remote-control/static/index.html'
      - 'remote-control/static/power-control.js'
      - 'remote-control/static/dashboard-control.js'
      - 'remote-control/static/launcher-admin.js'
      - 'remote-control/static/connections-ui.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false

      - name: Isolated Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Diagnose NAS deployment route
        shell: bash
        run: |
          set -u
          echo "RUNNER_HOST=$(hostname)"
          echo "RUNNER_IPS=$(hostname -I 2>/dev/null || true)"
          echo "PCT=$(command -v pct || true)"
          echo "SSH_CONFIG_BEGIN"
          grep -E '^(Host|[[:space:]]*HostName|[[:space:]]*User|[[:space:]]*IdentityFile)' ~/.ssh/config 2>/dev/null || true
          echo "SSH_CONFIG_END"
          echo "KEYS_BEGIN"
          find ~/.ssh /media/lgtv -maxdepth 2 -type f \( -name 'id_*' -o -name '*.pem' \) -printf '%p\n' 2>/dev/null || true
          echo "KEYS_END"
      - name: Deploy NAS control UI
        run: python3 tools/lab/deploy-native-launcher.py server.py static/index.html static/power-control.js static/launcher-admin.js static/connections-ui.js static/dashboard-control.js
