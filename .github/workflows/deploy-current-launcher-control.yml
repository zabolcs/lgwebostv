name: Deploy current launcher control

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/deploy-current-launcher-control.yml'
      - 'tools/lab/deploy-native-launcher.py'
      - 'remote-control/server.py'
      - 'remote-control/static/index.html'
      - 'remote-control/static/power-control.js'
      - 'remote-control/static/dashboard-control.js'
      - 'remote-control/static/launcher-admin.js'
      - 'remote-control/static/connections-ui.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false

      - name: Isolated Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Deploy NAS control UI
        shell: bash
        env:
          SSHPASS: ${{ secrets.LGTV_NAS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null || { echo "sshpass is required on the self-hosted runner"; exit 1; }
          sshpass -e ssh -o StrictHostKeyChecking=accept-new root@192.168.0.223 'mkdir -p /var/backups/lgtv-control && cp -a /opt/lgtv-control /var/backups/lgtv-control/pre-dashboard-$(date +%Y%m%d-%H%M%S)'
          for f in server.py static/index.html static/power-control.js static/launcher-admin.js static/connections-ui.js static/dashboard-control.js; do
            sshpass -e ssh -o StrictHostKeyChecking=accept-new root@192.168.0.223 "mkdir -p /opt/lgtv-control/$(dirname "$f")"
            sshpass -e scp -o StrictHostKeyChecking=accept-new "remote-control/$f" "root@192.168.0.223:/opt/lgtv-control/$f"
          done
          sshpass -e ssh -o StrictHostKeyChecking=accept-new root@192.168.0.223 'python3 -m py_compile /opt/lgtv-control/server.py && systemctl restart lgtv-control.service && systemctl is-active lgtv-control.service && grep -q dashboard-control.js /opt/lgtv-control/static/index.html && test -s /opt/lgtv-control/static/dashboard-control.js && echo NAS_DEPLOY=PASS'
