name: Deploy current launcher control

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/deploy-current-launcher-control.yml'
  workflow_dispatch:

permissions:
  contents: read

# deploy helper v2

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate helper
        run: python3 -m py_compile tools/lab/deploy-native-launcher.py remote-control/server.py

      - name: Probe runner Python SSH support
        run: |
          set -e
          echo "python=$(python3 --version 2>&1)"
          if python3 -c 'import paramiko' 2>/dev/null; then
            echo "PARAMIKO_SYSTEM=YES"
          else
            echo "PARAMIKO_SYSTEM=NO"
          fi
          if sudo -n true 2>/dev/null; then
            echo "SUDO_NONINTERACTIVE=YES"
          else
            echo "SUDO_NONINTERACTIVE=NO"
          fi
          FOUND="$(find /media/lgtv /home/actions -type d -path '*/site-packages/paramiko' -print -quit 2>/dev/null || true)"
          if [ -n "$FOUND" ]; then
            echo "PARAMIKO_SITE=$(dirname "$FOUND")"
          else
            echo "PARAMIKO_SITE=NONE"
          fi

      - name: Deploy server only
        run: |
          set -euo pipefail
          REMOTE_PY="$(find /media/lgtv /home/actions/lgtv-import -type f -path '*/tools/remote.py' -print -quit 2>/dev/null || true)"
          test -n "$REMOTE_PY" || { echo "remote.py checkpoint helper not found" >&2; exit 1; }
          PARAMIKO_DIR="$(find /home/actions/lgtv-runner/_work/_tool/Python -type d -path '*/site-packages/paramiko' -print -quit 2>/dev/null || true)"
          test -n "$PARAMIKO_DIR" || { echo "Paramiko runner environment not found" >&2; exit 1; }
          PARAMIKO_SITE="$(dirname "$PARAMIKO_DIR")"
          PYROOT="$(printf '%s\n' "$PARAMIKO_SITE" | sed -E 's#/lib/python[0-9.]+/site-packages$##')"
          PYTHON="$PYROOT/bin/python3"
          test -x "$PYTHON"
          "$PYTHON" -c 'import paramiko'
          echo "Using runner Python: $PYTHON"
          echo "Using remote helper: $REMOTE_PY"
          PYTHONPATH="$(dirname "$REMOTE_PY")${PYTHONPATH:+:$PYTHONPATH}" "$PYTHON" tools/lab/deploy-native-launcher.py server.py
