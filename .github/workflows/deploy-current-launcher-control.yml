name: Deploy current launcher control

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/deploy-current-launcher-control.yml'
      - 'tools/lab/deploy-native-launcher.py'
      - 'remote-control/server.py'
      - 'remote-control/static/index.html'
      - 'remote-control/static/power-control.js'
      - 'remote-control/static/dashboard-control.js'
      - 'remote-control/static/launcher-admin.js'
      - 'remote-control/static/connections-ui.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false

      - name: Isolated Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install SSH client library
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko


      - name: Prepare encrypted credential transport
        shell: bash
        run: |
          set -euo pipefail
          dir="$HOME/.cache/lgtv-deploy-transport"
          mkdir -p "$dir"
          chmod 700 "$dir"
          if [ ! -f "$dir/private.pem" ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$dir/private.pem" >/dev/null 2>&1
            chmod 600 "$dir/private.pem"
          fi
          openssl pkey -in "$dir/private.pem" -pubout -out "$RUNNER_TEMP/lgtv-deploy-public.pem"

      - name: Upload deploy transport public key
        uses: actions/upload-artifact@v4
        with:
          name: lgtv-deploy-public-key
          path: ${{ runner.temp }}/lgtv-deploy-public.pem
          retention-days: 1
          if-no-files-found: error

      - name: Deploy NAS control UI through Proxmox
        env:
          LGTV_REMOTE_HELPER: /media/lgtv/checkpoint-20260925-20260925-092443/source/previous-work-20260905/remote.py
        run: |
          set -euo pipefail
          python3 tools/lab/deploy-native-launcher.py             server.py             static/index.html             static/power-control.js             static/launcher-admin.js             static/connections-ui.js             static/dashboard-control.js
