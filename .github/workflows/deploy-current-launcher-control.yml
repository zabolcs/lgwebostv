name: Deploy current launcher control

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/deploy-current-launcher-control.yml'
  workflow_dispatch:

permissions:
  contents: read

# deploy helper v2

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate helper
        run: python3 -m py_compile tools/lab/deploy-native-launcher.py remote-control/server.py

      - name: Deploy server only
        run: |
          set -euo pipefail
          PVE=192.168.0.120
          KNOWN="$(mktemp)"
          CT_SCRIPT="$(mktemp)"
          trap 'rm -f "$KNOWN" "$CT_SCRIPT"' EXIT
          ssh-keyscan -T 3 "$PVE" >"$KNOWN" 2>/dev/null
          KEY=""
          while IFS= read -r candidate; do
            test -f "$candidate" || continue
            ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || continue
            if ssh -T -i "$candidate" -o BatchMode=yes -o ConnectTimeout=2 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" "root@$PVE" true >/dev/null 2>&1; then
              KEY="$candidate"
              break
            fi
          done < <(find /media/lgtv /home/actions -type f \( -name 'id_rsa' -o -name 'id_ed25519' -o -name '*.pem' -o -name '*pve*key*' \) -print 2>/dev/null | head -100)
          test -n "$KEY" || { echo "No runner SSH key authenticates to root@$PVE" >&2; exit 1; }
          echo "Using PVE key: $KEY"
          SSH=(ssh -T -i "$KEY" -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" "root@$PVE")
          SCP=(scp -q -i "$KEY" -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN")
          cat >"$CT_SCRIPT" <<'SH'
          #!/bin/sh
          set -eu
          BACKUP="$(mkdir -p /var/backups/lgtv-control && mktemp -d /var/backups/lgtv-control/launcher-webhook.XXXXXX)"
          echo "Rollback: $BACKUP"
          cp -p /opt/lgtv-control/server.py "$BACKUP/server.py"
          rollback() {
            echo "Server deploy failed; rolling back to $BACKUP" >&2
            cp -p "$BACKUP/server.py" /opt/lgtv-control/server.py
            systemctl restart lgtv-control.service || true
          }
          trap rollback EXIT HUP INT TERM
          python3 -m py_compile /tmp/lgtv-control-server.py
          install -o root -g root -m 0755 /tmp/lgtv-control-server.py /opt/lgtv-control/server.py
          systemctl restart lgtv-control.service
          sleep 2
          systemctl is-active --quiet lgtv-control.service
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8765/api/health", timeout=5) as response:
              payload = json.load(response)
          assert payload.get("ok") is True, payload
          print("health=" + json.dumps(payload, separators=(",", ":")))
          PY
          grep -q 'def send_launcher_webhook' /opt/lgtv-control/server.py
          trap - EXIT HUP INT TERM
          echo DEPLOY_LAUNCHER_CONTROL=PASS
          SH
          "${SCP[@]}" remote-control/server.py "root@$PVE:/tmp/lgtv-control-server.py"
          "${SCP[@]}" "$CT_SCRIPT" "root@$PVE:/tmp/deploy-lgtv-control.sh"
          "${SSH[@]}" "pct push 125 /tmp/lgtv-control-server.py /tmp/lgtv-control-server.py && pct push 125 /tmp/deploy-lgtv-control.sh /tmp/deploy-lgtv-control.sh && pct exec 125 -- chmod 700 /tmp/deploy-lgtv-control.sh && pct exec 125 -- /tmp/deploy-lgtv-control.sh"
