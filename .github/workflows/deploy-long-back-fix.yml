name: Deploy long Back launcher fix

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/deploy-long-back-fix.yml'
      - 'tools/lab/deploy-long-back-fix.py'

permissions:
  contents: read

concurrency:
  group: deploy-long-back-fix
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false

      - name: Isolated Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install transport dependency
        run: python -m pip install --disable-pip-version-check --quiet 'paramiko==3.5.1'

      - name: Prepare pinned ARM compiler
        shell: bash
        run: |
          set -euo pipefail
          ZIG_ROOT=/tmp/lgtv-zig-0.14.1
          ZIG_TAR=/tmp/zig-x86_64-linux-0.14.1.tar.xz
          if [ ! -x "$ZIG_ROOT/zig" ]; then
            curl --fail --location --silent --show-error               https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz               --output "$ZIG_TAR"
            printf '%s  %s\n'               '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c'               "$ZIG_TAR" | sha256sum -c -
            rm -rf "$ZIG_ROOT" /tmp/zig-x86_64-linux-0.14.1
            tar -xJf "$ZIG_TAR" -C /tmp
            mv /tmp/zig-x86_64-linux-0.14.1 "$ZIG_ROOT"
          fi
          "$ZIG_ROOT/zig" version
          echo "BROKER_CC=$ZIG_ROOT/zig cc -target arm-linux-musleabi" >> "$GITHUB_ENV"

      - name: Validate source and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile remote-control/server.py tools/lab/deploy-long-back-fix.py tools/lab/deploy-native-launcher.py
          sh -n tools/generated-tv-scripts/home-key.sh
          make -C remote-broker clean all CC="$BROKER_CC"
          file remote-broker/remote-broker
          python remote-control/tests/test_server.py

      - name: Deploy TV broker and long Back action
        run: python tools/lab/deploy-long-back-fix.py

      - name: Locate private transport helper
        id: transport
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_PY="$(find /media/lgtv /home/actions/lgtv-import -type f -path '*/tools/remote.py' -print -quit 2>/dev/null || true)"
          test -n "$REMOTE_PY" || { echo "remote.py checkpoint helper not found" >&2; exit 1; }
          echo "dir=$(dirname "$REMOTE_PY")" >> "$GITHUB_OUTPUT"

      - name: Deploy matching control backend
        shell: bash
        env:
          REMOTE_HELPER_DIR: ${{ steps.transport.outputs.dir }}
        run: |
          set -euo pipefail
          PYTHONPATH="$REMOTE_HELPER_DIR${PYTHONPATH:+:$PYTHONPATH}" python tools/lab/deploy-native-launcher.py server.py

      - name: Verify live TV long Back contract
        shell: bash
        run: |
          set -euo pipefail
          KNOWN="$(mktemp)"
          trap 'rm -f "$KNOWN"' EXIT
          ssh-keyscan -T 3 192.168.0.240 >"$KNOWN" 2>/dev/null
          SSH=(ssh -T -i /media/lgtv/id_rsa -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" root@192.168.0.240)
          "${SSH[@]}" "set -eu;
            grep -qx '412=long-action' /var/lib/webosbrew/remote-broker/bindings.conf;
            test -x /var/lib/webosbrew/remote-broker/actions/412;
            grep -q 'LAUNCHER_HOME_FORCE_MODE=full' /var/lib/webosbrew/remote-broker/actions/412;
            grep -q 'FORCE_MODE=' /var/lib/webosbrew/launcher-home/home-key.sh;
            /var/lib/webosbrew/remote-broker/remote-broker --config /var/lib/webosbrew/remote-broker/bindings.conf --check-config;
            echo LONG_BACK_LIVE_CONTRACT=PASS"
