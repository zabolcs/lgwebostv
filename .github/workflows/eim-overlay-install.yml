name: Install production EIM overlay

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/eim-overlay-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate installer
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/lab/install-eim-overlay.sh
          sh -n tools/generated-tv-scripts/launcher-eim-overlay

      - name: Refresh overlay hook without reboot
        shell: bash
        env:
          REFRESH_HOOK_ONLY: "1"
        run: |
          set -euo pipefail
          bash tools/lab/install-eim-overlay.sh
