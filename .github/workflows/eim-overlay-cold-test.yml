name: Production EIM overlay cold boot test

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/eim-overlay-cold-test.yml'
  workflow_dispatch:

permissions:
  contents: read

# trigger: failsafe cold verification
# trigger: ordered overlay cold verification

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate cold test
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/lab/eim-overlay-cold-test.sh
          sh -n tools/generated-tv-scripts/launcher-eim-overlay

      - name: Run cold boot verification
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lab/eim-overlay-cold-test.sh
