name: Deploy current launcher

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/deploy-current-launcher.yml'
      - 'apps/launcher/**'
      - 'apps/launcher-quick/**'
      - 'apps/launcher-overlay/**'
      - 'scripts/build-all.py'
      - 'scripts/install-local-on-tv.sh'
      - 'tools/lab/deploy-current-launcher.py'
  workflow_dispatch:

permissions:
  contents: read

# deploy helper v14

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Wake TV before deploy
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          req = urllib.request.Request(
              'http://192.168.0.223:8765/api/tv/power',
              data=json.dumps({'state':'on'}).encode(),
              headers={'Content-Type':'application/json'},
              method='POST',
          )
          try:
              urllib.request.urlopen(req, timeout=6).read()
          except Exception:
              pass
          time.sleep(4)
          PY
      - name: Validate current launcher
        run: |
          node tests/launcher-focus.test.js
          node tests/launcher-input-lifecycle.test.js
      - name: Deploy current launcher suite
        run: python3 tools/lab/deploy-current-launcher.py
