name: Quick Start prewarmed cover rollout

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/quick-start-cover-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

# one-shot: cached prewarm process proof v0.4.6

jobs:
  rollout:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate rollout
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/lab/quick-start-cover-rollout.sh
          sh -n tools/generated-tv-scripts/guard.sh
          grep -q "guard v0.4.6" tools/generated-tv-scripts/guard.sh

      - name: Deploy and measure prewarmed cover
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lab/quick-start-cover-rollout.sh
