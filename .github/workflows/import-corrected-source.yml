name: Import corrected source checkpoint

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/import-corrected-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify, import and push corrected source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=/home/actions/lgtv-import/LGTV-github-source-2026-09-25.zip
          EXPECTED_ZIP_SHA=1b5ddcafb739f8e1d9900626a353f42209173ed99f8efe6007b4683e638f735e
          EXPECTED_BROKER_SHA=a2e1ba57a32670a038576f7696da8d29fc09added04a5452a645dbff51397d7c

          test -f "$ZIP_PATH"
          test "$(sha256sum "$ZIP_PATH" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA"

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          python3 - "$ZIP_PATH" "$TMP" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          target = Path(sys.argv[2])

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  parts = [p for p in name.split("/") if p not in ("", ".")]
                  mode = info.external_attr >> 16
                  if name.startswith("/") or ".." in parts:
                      raise SystemExit(f"unsafe zip path: {name}")
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"symlink not allowed in source export: {name}")

              for info in zf.infolist():
                  zf.extract(info, target)
                  mode = (info.external_attr >> 16) & 0o777
                  path = target / info.filename
                  if mode and path.is_file():
                      path.chmod(mode)
          PY

          SOURCE_ROOT="$TMP/LGTV-github-source-2026-09-25"
          test -d "$SOURCE_ROOT"
          test -f "$SOURCE_ROOT/docs/SOURCE-COMPLETENESS-AUDIT.md"
          test -f "$SOURCE_ROOT/remote-broker/remote-broker.c"
          test "$(sha256sum "$SOURCE_ROOT/remote-broker/remote-broker.c" | awk '{print $1}')" = "$EXPECTED_BROKER_SHA"

          python3 - "$SOURCE_ROOT" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          files = [p for p in root.rglob("*") if p.is_file()]
          if len(files) != 237:
              raise SystemExit(f"expected 237 source files, found {len(files)}")

          forbidden = []
          for path in files:
              rel = path.relative_to(root).as_posix()
              low = rel.lower()
              base = path.name.lower()
              if low.endswith(".ipk"):
                  forbidden.append(rel)
              if base in {"id_rsa", "id_rsa.ppk"} or base.startswith("id_rsa."):
                  forbidden.append(rel)
              if low == "remote-broker/remote-broker":
                  forbidden.append(rel)
          if forbidden:
              raise SystemExit("forbidden files in source export: " + ", ".join(forbidden))
          PY

          python3 - "$SOURCE_ROOT" "$GITHUB_WORKSPACE" <<'PY'
          import shutil
          import sys
          from pathlib import Path

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])
          preserve = {
              "docs/ROADMAP.md",
          }

          for source in src.rglob("*"):
              if not source.is_file():
                  continue
              rel = source.relative_to(src).as_posix()
              if rel == ".git" or rel.startswith(".git/"):
                  continue
              if rel == ".github" or rel.startswith(".github/"):
                  continue
              if rel in preserve:
                  continue
              target = dst / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          PY

          test "$(sha256sum remote-broker/remote-broker.c | awk '{print $1}')" = "$EXPECTED_BROKER_SHA"
          git diff --check
          test -z "$(git diff --name-only --diff-filter=D)"

          echo "Import diff:"
          git status --short
          echo
          echo "Running broker/control contract suite before commit..."
          python3 remote-control/tests/test_server.py

          git add -A -- ':!.github/workflows/import-corrected-source.yml'
          if git diff --cached --quiet; then
              echo "No source changes to import."
              exit 0
          fi

          echo "Staged import:"
          git diff --cached --stat
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: import corrected complete LGTV source checkpoint"
          git push origin HEAD:develop
