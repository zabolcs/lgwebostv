name: Quick Start direct WAM reactivation probe

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/quick-start-wam-reactivate-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

# one-shot: remove only the verified stale overlay renderer left by WAM probes

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/lab/overlay-renderer-cleanup.sh
      - name: Clean stale overlay renderer
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lab/overlay-renderer-cleanup.sh
