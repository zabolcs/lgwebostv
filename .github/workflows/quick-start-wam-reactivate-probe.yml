name: Quick Start direct WAM reactivation probe

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/quick-start-wam-reactivate-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

# read-only retry: discover retained overlay instanceId before any renderer reset

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate probe
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/lab/quick-start-wam-instance-probe.sh
      - name: Discover retained overlay instance
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lab/quick-start-wam-instance-probe.sh
