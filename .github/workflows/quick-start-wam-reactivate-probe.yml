name: Quick Start direct WAM reactivation probe

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/quick-start-wam-reactivate-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

# one-shot: measure prewarmed direct WAM from native Active with fresh CDP target selection

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate probe
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/lab/quick-start-wam-active-sidecar-probe.sh
          node --check tools/lab/measure-launcher-cdp.mjs
      - name: Measure direct WAM from Active
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lab/quick-start-wam-active-sidecar-probe.sh
