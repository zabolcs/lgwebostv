name: Direct Activity Manager launch reboot measurement

on:
  workflow_dispatch:

permissions:
  contents: read

# ACG rerun marker

jobs:
  firstapp-reboot-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install probe, arm direct launch, reboot, measure and clean
        shell: bash
        run: |
          set -euo pipefail

          MARKER=/media/lgtv/rollback-20260925-pre-activity-manager/COMPLETE
          test -f "$MARKER"

          TV_HOST=192.168.0.240
          TV=root@"$TV_HOST"
          SOURCE_KEY=/media/lgtv/id_rsa
          APP_ID=hu.szabi.launcher.startupprobe
          SERVICE_ID=hu.szabi.launcher.startupprobe.service

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          KEY="$TMP/id_rsa"
          KNOWN="$TMP/known_hosts"

          cp "$SOURCE_KEY" "$KEY"
          chmod 600 "$KEY"
          ssh-keyscan -T 3 "$TV_HOST" >"$KNOWN" 2>/dev/null
          test -s "$KNOWN"

          SSH=(ssh -T -i "$KEY" -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" "$TV")
          SCP=(scp -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN")

          ssh_ok() {
            "${SSH[@]}" 'true' >/dev/null 2>&1
          }

          luna_file() {
            local label="$1"
            local uri="$2"
            local payload="$3"
            "${SSH[@]}" "luna-send -t 1 -f -w 5000 'luna://$uri' '$payload' 2>&1" >"$TMP/$label.txt"
          }

          extract_json() {
            python3 - "$1" <<'PY'
          import json
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          decoder = json.JSONDecoder()
          found = None
          for line in reversed(text.splitlines()):
              for index, char in enumerate(line):
                  if char != "{":
                      continue
                  try:
                      candidate, _ = decoder.raw_decode(line[index:])
                  except json.JSONDecodeError:
                      continue
                  if isinstance(candidate, dict):
                      found = candidate
                      break
              if found is not None:
                  break
          if found is None:
              raise SystemExit("no JSON response")
          print(json.dumps(found, separators=(",", ":")))
          PY
          }

          echo ROLLBACK_BASELINE=PASS
          ssh_ok
          echo TV_SSH_BEFORE=PASS

          python3 tools/lab/build-launcher-startup-probe.py >"$TMP/build.txt"
          IPK="$(find build -maxdepth 1 -type f -name 'hu.szabi.launcher.startupprobe_*.ipk' | head -1)"
          test -n "$IPK"

          REMOTE=/tmp/hu.szabi.firstapp-test.$$
          "${SSH[@]}" "mkdir -p '$REMOTE'"
          "${SCP[@]}" "$IPK" "$TV:$REMOTE/probe.ipk"
          "${SCP[@]}" scripts/install-local-on-tv.sh "$TV:$REMOTE/install.sh"
          SHA="$(sha256sum "$IPK" | awk '{print $1}')"
          "${SSH[@]}" "chmod 700 '$REMOTE/install.sh'; sh '$REMOTE/install.sh' '$REMOTE/probe.ipk' '$SHA'"
          echo PROBE_INSTALL=PASS

          MANIFEST="/media/developer/apps/usr/palm/applications/$APP_ID/appinfo.json"
          ACTIVITY_ID=""

          cleanup_live() {
            set +e
            if ssh_ok; then
              if [ -n "${ACTIVITY_ID:-}" ]; then
                "${SSH[@]}" "luna-send -t 1 -f -w 4000 'luna://com.palm.activitymanager/cancel' '{\"activityId\":$ACTIVITY_ID}' 2>&1" >/dev/null || true
              fi
              "${SSH[@]}" "/usr/bin/luna-send-pub -t 1 -w 30000 -f 'luna://com.webos.appInstallService/dev/remove' '{\"id\":\"$APP_ID\",\"subscribe\":true}'" >/dev/null 2>&1 || true
              "${SSH[@]}" "rm -rf '$REMOTE'" >/dev/null 2>&1 || true
            fi
          }
          trap 'cleanup_live; rm -rf "$TMP"' EXIT

          echo DIRECT_TEST_PREPARED=PASS

          CREATE_PAYLOAD='{"activity":{"name":"hu.szabi.launcher.startupprobe.directFirstApp","description":"Bounded direct firstAppLaunched application launch measurement","type":{"foreground":true,"persist":true,"continuous":true},"trigger":{"method":"luna://com.webos.bootManager/getBootStatus","params":{"subscribe":true},"where":{"prop":"firstAppLaunched","op":"=","val":true}},"callback":{"method":"luna://com.webos.service.applicationmanager/launch","params":{"id":"hu.szabi.launcher.startupprobe","params":{"source":"activity-direct-firstapp"}}}},"replace":true,"start":true,"subscribe":false}'
          luna_file arm_firstapp com.palm.activitymanager/create "$CREATE_PAYLOAD"
          ARM="$(extract_json "$TMP/arm_firstapp.txt")"
          echo "FIRSTAPP_ARM=$ARM"
          echo "$ARM" | grep -q '"returnValue":true'

          ACTIVITY_ID="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("activityId",""))' "$ARM")"
          test -n "$ACTIVITY_ID"
          echo "FIRSTAPP_ACTIVITY_ID=$ACTIVITY_ID"

          luna_file firstapp_details com.palm.activitymanager/getDetails "{\"activityId\":$ACTIVITY_ID,\"current\":false,\"internal\":false}"
          DETAILS="$(extract_json "$TMP/firstapp_details.txt")"
          echo "FIRSTAPP_ACTIVITY_DETAILS=$DETAILS"
          echo "$DETAILS" | grep -q '"returnValue":true'
          echo "$DETAILS" | grep -q 'firstAppLaunched'
          echo "$DETAILS" | grep -q 'com.webos.bootManager/getBootStatus'
          echo "$DETAILS" | grep -q 'applicationmanager/launch'
          echo DIRECT_ACTIVITY_VERIFIED=PASS

          sleep 2

          PRE_UPTIME="$("${SSH[@]}" "cut -d' ' -f1 /proc/uptime")"
          echo "PRE_REBOOT_UPTIME_SECONDS=$PRE_UPTIME"

          REBOOT_REQUEST_EPOCH="$(date +%s)"
          echo "REBOOT_REQUEST_EPOCH=$REBOOT_REQUEST_EPOCH"
          "${SSH[@]}" 'sync; reboot' >/dev/null 2>&1 || true
          echo REBOOT_COMMAND_SENT=PASS

          DROPPED=0
          for i in $(seq 1 45); do
            if ! ssh_ok; then
              DROPPED=1
              echo "SSH_DROPPED_AFTER_SECONDS=$i"
              break
            fi
            sleep 1
          done
          test "$DROPPED" -eq 1
          echo TV_SSH_DROP=PASS

          RETURNED=0
          for i in $(seq 1 180); do
            if ssh_ok; then
              RETURNED=1
              echo "SSH_RETURNED_AFTER_SECONDS=$i"
              break
            fi
            sleep 1
          done
          test "$RETURNED" -eq 1
          echo TV_SSH_AFTER=PASS

          SSH_UPTIME="$("${SSH[@]}" "cut -d' ' -f1 /proc/uptime")"
          echo "SSH_RETURN_BOOT_UPTIME_SECONDS=$SSH_UPTIME"

          TIMING=""
          for i in $(seq 1 120); do
            TIMING="$(node tools/lab/measure-launcher-cdp.mjs "$APP_ID" 2>/dev/null || true)"
            if [ -n "$TIMING" ]; then
              echo "PROBE_RENDERER_SEEN_AFTER_SSH_HALFSECONDS=$i"
              break
            fi
            sleep 0.5
          done
          test -n "$TIMING"
          echo "PROBE_CDP_TIMING=$TIMING"

          TV_NOW="$("${SSH[@]}" 'date +%s')"
          CURRENT_UPTIME="$("${SSH[@]}" "cut -d' ' -f1 /proc/uptime")"
          GUARD_EPOCH="$("${SSH[@]}" 'cat /tmp/hu.szabi.launcher.last-launch 2>/dev/null || true')"
          echo "TV_NOW_EPOCH=$TV_NOW"
          echo "CURRENT_BOOT_UPTIME_SECONDS=$CURRENT_UPTIME"
          echo "GUARD_LAST_LAUNCH_EPOCH=$GUARD_EPOCH"

          python3 - "$TIMING" "$TV_NOW" "$CURRENT_UPTIME" <<'PY'
          import json
          import sys
          timing = json.loads(sys.argv[1])
          tv_now = float(sys.argv[2])
          current_uptime = float(sys.argv[3])
          for key, label in (
              ("start", "APP_START_BOOT_UPTIME_SECONDS"),
              ("ready", "APP_READY_BOOT_UPTIME_SECONDS"),
              ("paint", "APP_FIRST_PAINT_BOOT_UPTIME_SECONDS"),
          ):
              value = timing.get(key)
              if isinstance(value, (int, float)):
                  boot_uptime = current_uptime - ((tv_now * 1000 - value) / 1000.0)
                  print(f"{label}={boot_uptime:.3f}")
          PY

          if echo "$GUARD_EPOCH" | grep -Eq '^[0-9]+
          luna_file post_details com.palm.activitymanager/getDetails "{\"activityId\":$ACTIVITY_ID,\"current\":false,\"internal\":false}"
          POST_DETAILS="$(extract_json "$TMP/post_details.txt" 2>/dev/null || true)"
          echo "POST_REBOOT_ACTIVITY_DETAILS=$POST_DETAILS"

          "${SSH[@]}" "luna-send -t 1 -f -w 4000 'luna://com.palm.activitymanager/cancel' '{\"activityId\":$ACTIVITY_ID}' 2>&1" >"$TMP/cancel.txt" || true
          sleep 1
          luna_file verify_removed com.palm.activitymanager/getDetails "{\"activityId\":$ACTIVITY_ID,\"current\":false,\"internal\":false}"
          REMOVED="$(extract_json "$TMP/verify_removed.txt" 2>/dev/null || true)"
          echo "ACTIVITY_AFTER_CANCEL=$REMOVED"
          if echo "$REMOVED" | grep -q '"returnValue":true'; then
            echo ACTIVITY_REMOVE=FAILED
            exit 2
          fi
          ACTIVITY_ID=""
          echo ACTIVITY_REMOVE=PASS

          "${SSH[@]}" "/usr/bin/luna-send-pub -t 1 -w 30000 -f 'luna://com.webos.appInstallService/dev/remove' '{\"id\":\"$APP_ID\",\"subscribe\":true}'" >/dev/null 2>&1 || true
          REMOVED_APP=0
          for i in $(seq 1 40); do
            if "${SSH[@]}" "test ! -e '$MANIFEST'"; then
              REMOVED_APP=1
              break
            fi
            sleep 0.5
          done
          test "$REMOVED_APP" -eq 1
          echo PROBE_REMOVE=PASS
          "${SSH[@]}" "rm -rf '$REMOTE'" || true
          echo PRODUCTION_LAUNCHER_UNCHANGED=PASS

          trap 'rm -rf "$TMP"' EXIT
; then
            GUARD_UPTIME="$(python3 -c 'import sys; now=float(sys.argv[1]); up=float(sys.argv[2]); mark=float(sys.argv[3]); print(round(up-(now-mark),3))' "$TV_NOW" "$CURRENT_UPTIME" "$GUARD_EPOCH")"
            echo "GUARD_DISPATCH_BOOT_UPTIME_SECONDS=$GUARD_UPTIME"
          else
            echo GUARD_DISPATCH_BOOT_UPTIME_SECONDS=unknown
          fi

          luna_file foreground com.webos.service.applicationmanager/getForegroundAppInfo '{}'
          FOREGROUND="$(extract_json "$TMP/foreground.txt" 2>/dev/null || true)"
          echo "POST_REBOOT_FOREGROUND=$FOREGROUND"

          luna_file post_details com.palm.activitymanager/getDetails "{\"activityId\":$ACTIVITY_ID,\"current\":false,\"internal\":false}"
          POST_DETAILS="$(extract_json "$TMP/post_details.txt")"
          echo "POST_REBOOT_ACTIVITY_DETAILS=$POST_DETAILS"
          echo "$POST_DETAILS" | grep -q '"returnValue":true'
          echo "$POST_DETAILS" | grep -q 'firstAppLaunched'
          echo POST_REBOOT_ACTIVITY_VERIFIED=PASS

          "${SSH[@]}" "rm -rf '$REMOTE'" || true
          echo PROBE_LEFT_INSTALLED=YES
          echo PRODUCTION_LAUNCHER_UNCHANGED=PASS
