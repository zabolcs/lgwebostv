name: First-app-launched Activity Manager reboot test

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/activity-manager-firstapp-reboot-test.yml'

permissions:
  contents: read

jobs:
  firstapp-reboot-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Replace bootup probe and measure firstAppLaunched across reboot
        shell: bash
        run: |
          set -euo pipefail

          MARKER=/media/lgtv/rollback-20260925-pre-activity-manager/COMPLETE
          test -f "$MARKER"

          TV_HOST=192.168.0.240
          TV=root@"$TV_HOST"
          SOURCE_KEY=/media/lgtv/id_rsa
          SERVICE_ID=hu.szabi.launcher.startupprobe.service
          OLD_ACTIVITY_ID=483

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          KEY="$TMP/id_rsa"
          KNOWN="$TMP/known_hosts"

          cp "$SOURCE_KEY" "$KEY"
          chmod 600 "$KEY"
          ssh-keyscan -T 3 "$TV_HOST" >"$KNOWN" 2>/dev/null
          test -s "$KNOWN"

          SSH=(ssh -T -i "$KEY" -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" "$TV")
          SCP=(scp -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN")

          ssh_ok() {
            "${SSH[@]}" 'true' >/dev/null 2>&1
          }

          luna_file() {
            local label="$1"
            local uri="$2"
            local payload="$3"
            "${SSH[@]}" "luna-send -t 1 -f -w 5000 'luna://$uri' '$payload' 2>&1" >"$TMP/$label.txt"
          }

          extract_json() {
            python3 - "$1" <<'PY'
          import json
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          decoder = json.JSONDecoder()
          found = None
          for line in reversed(text.splitlines()):
              for index, char in enumerate(line):
                  if char != "{":
                      continue
                  try:
                      candidate, _ = decoder.raw_decode(line[index:])
                  except json.JSONDecodeError:
                      continue
                  if isinstance(candidate, dict):
                      found = candidate
                      break
              if found is not None:
                  break
          if found is None:
              raise SystemExit("no JSON response")
          print(json.dumps(found, separators=(",", ":")))
          PY
          }

          echo ROLLBACK_BASELINE=PASS
          ssh_ok
          echo TV_SSH_BEFORE=PASS

          python3 tools/lab/build-launcher-startup-probe.py >"$TMP/build.txt"
          IPK="$(find build -maxdepth 1 -type f -name 'hu.szabi.launcher.startupprobe_*.ipk' | head -1)"
          test -n "$IPK"

          REMOTE=/tmp/hu.szabi.firstapp-test.$$
          "${SSH[@]}" "mkdir -p '$REMOTE'"
          "${SCP[@]}" "$IPK" "$TV:$REMOTE/probe.ipk"
          "${SCP[@]}" scripts/install-local-on-tv.sh "$TV:$REMOTE/install.sh"
          SHA="$(sha256sum "$IPK" | awk '{print $1}')"
          "${SSH[@]}" "chmod 700 '$REMOTE/install.sh'; sh '$REMOTE/install.sh' '$REMOTE/probe.ipk' '$SHA'"
          echo PROBE_INSTALL=PASS

          luna_file status "$SERVICE_ID/status" '{}' || true
          STATUS="$(extract_json "$TMP/status.txt" 2>/dev/null || true)"
          if ! echo "$STATUS" | grep -q '"returnValue":true'; then
            "${SSH[@]}" "/usr/bin/run-js-service -n '/media/developer/apps/usr/palm/services/$SERVICE_ID' >/tmp/startupprobe-firstapp-activate.log 2>&1 &" || true
            sleep 2
            luna_file status_retry "$SERVICE_ID/status" '{}'
            STATUS="$(extract_json "$TMP/status_retry.txt")"
          fi
          echo "$STATUS" | grep -q '"returnValue":true'
          echo SERVICE_STATUS=PASS

          luna_file cancel_old "$SERVICE_ID/cancel" "{\"manager\":\"palm\",\"activityId\":$OLD_ACTIVITY_ID}" || true
          CANCEL_OLD="$(extract_json "$TMP/cancel_old.txt" 2>/dev/null || true)"
          echo "OLD_BOOTUP_CANCEL=$CANCEL_OLD"

          luna_file old_details com.palm.activitymanager/getDetails "{\"activityId\":$OLD_ACTIVITY_ID,\"current\":false,\"internal\":false}" || true
          OLD_DETAILS="$(extract_json "$TMP/old_details.txt" 2>/dev/null || true)"
          echo "OLD_BOOTUP_DETAILS_AFTER_CANCEL=$OLD_DETAILS"
          if echo "$OLD_DETAILS" | grep -q '"returnValue":true'; then
            echo OLD_BOOTUP_ACTIVITY_STILL_PRESENT
            exit 1
          fi
          echo OLD_BOOTUP_ACTIVITY_REMOVED=PASS

          luna_file arm_firstapp "$SERVICE_ID/armFirstAppLaunched" '{"manager":"palm"}'
          ARM="$(extract_json "$TMP/arm_firstapp.txt")"
          echo "FIRSTAPP_ARM=$ARM"
          echo "$ARM" | grep -q '"returnValue":true'

          ACTIVITY_ID="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("activityId",""))' "$ARM")"
          test -n "$ACTIVITY_ID"
          echo "FIRSTAPP_ACTIVITY_ID=$ACTIVITY_ID"

          luna_file firstapp_details com.palm.activitymanager/getDetails "{\"activityId\":$ACTIVITY_ID,\"current\":false,\"internal\":false}"
          DETAILS="$(extract_json "$TMP/firstapp_details.txt")"
          echo "FIRSTAPP_ACTIVITY_DETAILS=$DETAILS"
          echo "$DETAILS" | grep -q '"returnValue":true'
          echo "$DETAILS" | grep -q 'firstAppLaunched'
          echo "$DETAILS" | grep -q 'com.webos.bootManager/getBootStatus'
          echo "$DETAILS" | grep -q "$SERVICE_ID/probe"
          echo FIRSTAPP_ACTIVITY_VERIFIED=PASS

          sleep 2
          luna_file pre_status "$SERVICE_ID/status" '{}'
          PRE_STATUS="$(extract_json "$TMP/pre_status.txt")"
          echo "PRE_REBOOT_STATUS=$PRE_STATUS"

          PRE_UPTIME="$("${SSH[@]}" "cut -d' ' -f1 /proc/uptime")"
          echo "PRE_REBOOT_UPTIME_SECONDS=$PRE_UPTIME"

          REBOOT_REQUEST_EPOCH="$(date +%s)"
          echo "REBOOT_REQUEST_EPOCH=$REBOOT_REQUEST_EPOCH"
          "${SSH[@]}" 'sync; reboot' >/dev/null 2>&1 || true
          echo REBOOT_COMMAND_SENT=PASS

          DROPPED=0
          for i in $(seq 1 45); do
            if ! ssh_ok; then
              DROPPED=1
              echo "SSH_DROPPED_AFTER_SECONDS=$i"
              break
            fi
            sleep 1
          done
          test "$DROPPED" -eq 1
          echo TV_SSH_DROP=PASS

          RETURNED=0
          for i in $(seq 1 180); do
            if ssh_ok; then
              RETURNED=1
              echo "SSH_RETURNED_AFTER_SECONDS=$i"
              break
            fi
            sleep 1
          done
          test "$RETURNED" -eq 1
          echo TV_SSH_AFTER=PASS

          SSH_UPTIME="$("${SSH[@]}" "cut -d' ' -f1 /proc/uptime")"
          echo "SSH_RETURN_BOOT_UPTIME_SECONDS=$SSH_UPTIME"

          CALLBACK_SEEN=0
          POST_STATUS=""
          for i in $(seq 1 90); do
            luna_file post_status "$SERVICE_ID/status" '{}' || true
            POST_STATUS="$(extract_json "$TMP/post_status.txt" 2>/dev/null || true)"
            if [ -n "$POST_STATUS" ]; then
              KIND="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print((((d.get("state") or {}).get("lastProbe") or {}).get("kind")) or "")' "$POST_STATUS")"
              if [ "$KIND" = "firstAppLaunched" ]; then
                CALLBACK_SEEN=1
                echo "FIRSTAPP_CALLBACK_SEEN_AFTER_SSH_SECONDS=$i"
                break
              fi
            fi
            sleep 1
          done
          echo "POST_REBOOT_STATUS=$POST_STATUS"
          test "$CALLBACK_SEEN" -eq 1

          CALLBACK_UPTIME="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print((((d.get("state") or {}).get("lastProbe") or {}).get("bootUptimeSeconds")) or "")' "$POST_STATUS")"
          CALLBACK_EPOCH_MS="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print((((d.get("state") or {}).get("lastProbe") or {}).get("epochMs")) or "")' "$POST_STATUS")"
          test -n "$CALLBACK_UPTIME"
          echo FIRSTAPP_CALLBACK=PASS
          echo "CALLBACK_BOOT_UPTIME_SECONDS=$CALLBACK_UPTIME"
          echo "CALLBACK_EPOCH_MS=$CALLBACK_EPOCH_MS"

          TV_NOW="$("${SSH[@]}" 'date +%s')"
          CURRENT_UPTIME="$("${SSH[@]}" "cut -d' ' -f1 /proc/uptime")"
          GUARD_EPOCH="$("${SSH[@]}" 'cat /tmp/hu.szabi.launcher.last-launch 2>/dev/null || true')"
          echo "TV_NOW_EPOCH=$TV_NOW"
          echo "CURRENT_BOOT_UPTIME_SECONDS=$CURRENT_UPTIME"
          echo "GUARD_LAST_LAUNCH_EPOCH=$GUARD_EPOCH"
          if echo "$GUARD_EPOCH" | grep -Eq '^[0-9]+$'; then
            GUARD_UPTIME="$(python3 -c 'import sys; now=float(sys.argv[1]); up=float(sys.argv[2]); mark=float(sys.argv[3]); print(round(up-(now-mark),3))' "$TV_NOW" "$CURRENT_UPTIME" "$GUARD_EPOCH")"
            echo "GUARD_DISPATCH_BOOT_UPTIME_SECONDS=$GUARD_UPTIME"
          else
            echo GUARD_DISPATCH_BOOT_UPTIME_SECONDS=unknown
          fi

          luna_file post_details com.palm.activitymanager/getDetails "{\"activityId\":$ACTIVITY_ID,\"current\":false,\"internal\":false}"
          POST_DETAILS="$(extract_json "$TMP/post_details.txt")"
          echo "POST_REBOOT_ACTIVITY_DETAILS=$POST_DETAILS"
          echo "$POST_DETAILS" | grep -q '"returnValue":true'
          echo "$POST_DETAILS" | grep -q 'firstAppLaunched'
          echo POST_REBOOT_ACTIVITY_VERIFIED=PASS

          "${SSH[@]}" "rm -rf '$REMOTE'" || true
          echo PROBE_LEFT_INSTALLED=YES
          echo PRODUCTION_LAUNCHER_UNCHANGED=PASS
