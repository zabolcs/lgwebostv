name: Quick Start launcher wake test

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/quick-start-launcher-wake-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate test
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/lab/quick-start-launcher-wake-test.sh

      - name: Run Quick Start standby wake verification
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lab/quick-start-launcher-wake-test.sh
