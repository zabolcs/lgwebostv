name: Probe live remote broker
# verify long Back deployment

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/probe-live-remote-broker.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Probe broker
        shell: bash
        run: |
          set -euo pipefail
          KNOWN="$(mktemp)"
          trap 'rm -f "$KNOWN"' EXIT
          ssh-keyscan -T 3 192.168.0.240 >"$KNOWN" 2>/dev/null
          SSH=(ssh -T -i /media/lgtv/id_rsa -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" root@192.168.0.240)
          "${SSH[@]}" 'set -u
            echo "ENABLED=$(test -f /var/lib/webosbrew/remote-broker/enabled && echo yes || echo no)"
            echo "VERSION=$(/var/lib/webosbrew/remote-broker/remote-broker --version 2>&1 || true)"
            echo "--- CONFIG ---"
            cat /var/lib/webosbrew/remote-broker/bindings.conf 2>/dev/null || true
            echo "--- PROCESSES ---"
            ps | grep -E "[r]emote-broker" || true
            echo "--- CHECK ---"
            /var/lib/webosbrew/remote-broker/remote-broker --config /var/lib/webosbrew/remote-broker/bindings.conf --check-config 2>&1 || true
            echo "--- DEVICES ---"
            for e in /dev/input/event*; do n=$(cat /sys/class/input/${e##*/}/device/name 2>/dev/null || true); case "$n" in *"M-RCU"*) echo "$e :: $n";; esac; done
          '
          scp -q -i /media/lgtv/id_rsa -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" root@192.168.0.240:/var/lib/webosbrew/remote-broker/remote-broker /tmp/live-remote-broker
          file /tmp/live-remote-broker
          readelf -h /tmp/live-remote-broker | sed -n '1,30p'
