name: Temporary EIM overlay session test

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/eim-overlay-session-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate script
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/lab/eim-overlay-session-test.sh
          sh -n tools/generated-tv-scripts/launcher-eim-overlay

      - name: Run temporary overlay session test
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lab/eim-overlay-session-test.sh
