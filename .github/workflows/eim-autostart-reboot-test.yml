name: Guarded EIM autostart boot measurement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate production EIM integration
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/lab/eim-autostart-reboot-test.sh
          python3 scripts/build-all.py
          test -f build/hu.szabi.launcher_0.3.12_all.ipk
          echo PRODUCTION_EIM_VALIDATION=PASS

      - name: Run guarded production EIM boot integration
        shell: bash
        env:
          PRODUCTION_MODE: "1"
          KEEP_EIM_ON_SUCCESS: "1"
          APP_ID: "hu.szabi.launcher"
          VERSION: "0.3.12"
        run: |
          set -euo pipefail
          bash tools/lab/eim-autostart-reboot-test.sh
