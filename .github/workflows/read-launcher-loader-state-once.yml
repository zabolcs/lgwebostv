name: Read launcher loader state once

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/read-launcher-loader-state-once.yml'

permissions:
  contents: read

# freeze probe

jobs:
  read:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read launcher DOM state
        shell: bash
        run: |
          set -euo pipefail
          node tools/lab/launcher-timing-read.mjs '(function(){var x=document.getElementById("launcher-boot");if(x){x.hidden=true;x.style.setProperty("display","none","important");}document.body.classList.remove("launcher-loading-active");return JSON.stringify({hidden:document.hidden,activated:window.PalmSystem&&window.PalmSystem.isActivated,bootHidden:x?x.hidden:null,bootDisplay:x?getComputedStyle(x).display:null,bodyClass:document.body.className});})()'
