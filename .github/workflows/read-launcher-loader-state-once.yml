name: Read launcher loader state once

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/read-launcher-loader-state-once.yml'

permissions:
  contents: read

# freeze probe

jobs:
  read:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read launcher DOM state
        shell: bash
        run: |
          set -euo pipefail
          node tools/lab/probe-loading-input-lock.mjs
