name: Quick Start self-wake probe

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/quick-start-selfwake-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

# one-shot: verify in-renderer PalmSystem.activate wake path

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate probe
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/lab/inject-launcher-selfwake-cdp.mjs
          bash -n tools/lab/quick-start-selfwake-probe.sh

      - name: Run isolated self-wake probe
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lab/quick-start-selfwake-probe.sh
